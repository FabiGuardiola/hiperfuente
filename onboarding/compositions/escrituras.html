<template>
  <style>
    @font-face { font-family: "FabiBlock"; src: url("assets/fonts/FabiBlock-Regular.otf"); }
    #root { position: absolute; inset: 0; background: #e9e3d6; overflow: hidden; }
    .esc-captura { position: absolute; left: 760px; top: 150px; width: 1040px; height: 585px; }
    .esc-captura .marco { position: absolute; inset: 0; overflow: hidden; border: 2px solid #1f1d1b; }
    .esc-captura img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .esc-texto { position: absolute; left: 120px; top: 150px; width: 580px; }
    .esc-texto b { display: block; font-family: "FabiBlock"; font-weight: 400; font-size: 60px; line-height: 1.08; color: #1f1d1b; }
    .esc-texto > span { display: block; margin-top: 22px; font-family: "IBM Plex Mono"; font-size: 30px; line-height: 1.42; color: #1f1d1b; }
    #esc-indice { position: absolute; left: 120px; top: 560px; font-family: "IBM Plex Mono"; font-size: 28px; line-height: 1.55; }
    #esc-indice div { color: #6f6a60; }
    #esc-frase { position: absolute; left: 120px; top: 900px; font-family: "IBM Plex Mono"; font-size: 30px; color: #1f1d1b; white-space: nowrap; }
    .letra { opacity: 0; }
  </style>
  <div id="root" data-composition-id="escrituras" data-width="1920" data-height="1080">
    <div id="esc-c1" class="esc-captura clip" data-start="0" data-duration="5.8"><div class="marco"><img src="assets/capturas/muro.jpg" alt="Muro de texto en el visor" /></div></div>
    <div id="esc-c2" class="esc-captura clip" data-start="5.6" data-duration="5.8"><div class="marco"><img src="assets/capturas/escalera.jpg" alt="Escalera de renglones detrás de la H" /></div></div>
    <div id="esc-c3" class="esc-captura clip" data-start="11.2" data-duration="5.8"><div class="marco"><img src="assets/capturas/anamorfosis.jpg" alt="Anamorfosis vista desde el mirador" /></div></div>
    <div id="esc-c4" class="esc-captura clip" data-start="16.8" data-duration="5.8"><div class="marco"><img src="assets/capturas/cartel.jpg" alt="Cartel de la empleada en el núcleo" /></div></div>
    <div id="esc-c5" class="esc-captura clip" data-start="22.4" data-duration="5.6"><div class="marco"><img src="assets/capturas/mausoleo.jpg" alt="Los cuatro paños del mausoleo" /></div></div>
    <div id="esc-t1" class="esc-texto clip" data-hold data-start="0" data-duration="5.6"><b>MURO DE TEXTO</b><span>El testimonio del personaje: lo que declara.</span></div>
    <div id="esc-t2" class="esc-texto clip" data-hold data-start="5.6" data-duration="5.6"><b>ESCALERA</b><span>La narración del capítulo. Se lee subiendo, renglón por renglón.</span></div>
    <div id="esc-t3" class="esc-texto clip" data-hold data-start="11.2" data-duration="5.6"><b>ANAMORFOSIS</b><span>La cita del personaje. Solo se arma desde el mirador.</span></div>
    <div id="esc-t4" class="esc-texto clip" data-hold data-start="16.8" data-duration="5.6"><b>CARTEL</b><span>El folio de la empleada, en el núcleo.</span></div>
    <div id="esc-t5" class="esc-texto clip" data-hold data-start="22.4" data-duration="5.6"><b>MAUSOLEO</b><span>El registro del expediente: muertos, evidencias, cotas, retratos.</span></div>
    <div id="esc-indice" class="clip" data-start="0" data-duration="28">
      <div id="esc-i1">muro de texto</div><div id="esc-i2">escalera</div><div id="esc-i3">anamorfosis</div><div id="esc-i4">cartel</div><div id="esc-i5">mausoleo</div>
    </div>
    <div id="esc-frase" class="clip" data-start="0" data-duration="28">Cada forma de escribir dice algo distinto.</div>
  </div>
  <script>
    (function () {
      for (const el of document.querySelectorAll("#root .esc-texto b, #root .esc-texto > span, #esc-frase")) {
        el.innerHTML = [...el.textContent].map((ch) => '<span class="letra">' + ch + "</span>").join("");
      }
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 28);
      tl.fromTo("#esc-frase .letra", { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.03, ease: "none" }, 0.4);
      const T = [0, 5.6, 11.2, 16.8, 22.4];
      T.forEach((t, i) => {
        const n = i + 1;
        // la captura entra recortada, de izquierda a derecha, por encima de la anterior
        tl.fromTo("#esc-c" + n + " .marco", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power3.inOut" }, t + 0.1);
        tl.fromTo("#esc-t" + n + " b .letra", { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.045, ease: "none" }, t + 0.3);
        tl.fromTo("#esc-t" + n + " > span .letra", { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.02, ease: "none" }, t + 1.0);
        tl.fromTo("#esc-i" + n, { color: "#6f6a60" }, { color: "#9b3d2e", duration: 0.2, ease: "none" }, t + 0.1);
        if (i < 4) tl.to("#esc-i" + n, { color: "#1f1d1b", duration: 0.2, ease: "none" }, T[i + 1]);
      });
      window.__timelines["escrituras"] = tl;
    })();
  </script>
</template>
