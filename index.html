:root {
  --noche: #16191C;        /* fondo mientras carga */
  --papel: #E9E3D6;
  --piedra: #A8A398;
  --lacre: #9B3D2E;
  --tinta: #2F4858;
  --velo: rgba(22, 25, 28, .62);
  --hyper: "FabiBlock", "Arial Black", sans-serif;
  --mono: "DM Mono", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
/* Reglas base: dentro de Claude las pone la plataforma, en GitHub Pages no. */
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--noche); color: var(--papel); font-family: var(--mono); font-size: 13px; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
.barra {
  position: fixed; left: 0; right: 0; top: 0; z-index: 2;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--velo), transparent);
  pointer-events: none;
}
.barra > * { pointer-events: auto; }
h1 { margin: 0; font-family: var(--hyper); font-weight: 400; font-size: 22px; letter-spacing: .02em; color: var(--papel); }
.grupo { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rotulo { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--piedra); margin-right: 2px; }
button {
  font: inherit; font-size: 12px; color: var(--papel); background: var(--velo);
  border: 1px solid rgba(233, 227, 214, .28); border-radius: 2px; padding: 7px 10px; cursor: pointer; min-height: 34px;
}
button[aria-pressed="true"] { background: var(--lacre); border-color: var(--lacre); }
button:focus-visible { outline: 2px solid var(--papel); outline-offset: 2px; }
.ayuda {
  position: fixed; z-index: 2; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(176px + env(safe-area-inset-bottom, 0px));
  max-width: 300px; font-size: 11px; margin: 0; line-height: 1.5; color: var(--piedra); text-align: right; pointer-events: none;
}
.palanca {
  position: fixed; z-index: 2; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  width: 128px; height: 128px; border-radius: 50%; border: 1px solid rgba(233, 227, 214, .35); background: var(--velo); touch-action: none;
}
#palanca { left: max(24px, env(safe-area-inset-left, 0px)); }
#mirarPalanca { right: max(24px, env(safe-area-inset-right, 0px)); }
.palanca span { position: absolute; left: 0; right: 0; top: -18px; text-align: center; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--piedra); pointer-events: none; }
.perilla { position: absolute; left: 44px; top: 44px; width: 40px; height: 40px; border-radius: 50%; background: var(--papel); opacity: .8; pointer-events: none; }
#mira { position: fixed; z-index: 2; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; }
#mira::before, #mira::after { content: ""; position: absolute; background: var(--papel); opacity: .85; }
#mira::before { left: 6px; top: 0; width: 2px; height: 14px; }
#mira::after { top: 6px; left: 0; height: 2px; width: 14px; }
.vertical { position: fixed; z-index: 2; left: calc(168px + env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.vertical button { width: 46px; }
#carga { position: fixed; inset: 0; z-index: 3; display: grid; place-content: center; gap: 10px; text-align: center; background: var(--noche); }
#carga strong { font-family: var(--hyper); font-weight: 400; font-size: 34px; color: var(--lacre); }
#barraCarga { width: 220px; height: 2px; background: rgba(233, 227, 214, .2); }
#barraCarga i { display: block; height: 100%; width: 0; background: var(--papel); }
.grav { min-width: 46px; font-weight: 500; line-height: 1.05; padding-top: 4px; padding-bottom: 4px; }
.grav small { display: block; font-size: 9px; font-weight: 400; letter-spacing: .03em; opacity: .85; white-space: nowrap; }
#capitulo { display: grid; line-height: 1.15; padding: 2px 12px; border-left: 3px solid var(--lacre); }
#capitulo b { font-family: var(--hyper); font-weight: 400; font-size: 17px; color: var(--papel); letter-spacing: .02em; }
#capitulo span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #e6e0d2; }
/* Mapa lateral: el icosaedro en miniatura, con el piso de la gravedad activa siempre abajo, y la ficha del lugar. */
#mapa {
  position: fixed; z-index: 2; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(112px + env(safe-area-inset-top, 0px));
  width: 190px; padding: 8px 10px 10px; background: rgba(22, 25, 28, .5); border-left: 1px solid rgba(233, 227, 214, .25);
  color: #fff; font-family: var(--mono); font-size: 9.5px; line-height: 1.4; pointer-events: none;
}
#mapaLienzo { display: block; position: static; inset: auto; width: 170px; height: 170px; }
#sonido { pointer-events: auto; display: block; width: 100%; margin-bottom: 6px; font-size: 12px; font-weight: 500; letter-spacing: .06em; padding: 9px 8px; text-align: left; }
#sonido[aria-pressed="true"] { background: var(--lacre); border-color: var(--lacre); }
#aviso { min-height: 0; font-size: 10.5px; line-height: 1.35; color: #fff; background: rgba(155, 61, 46, .85); padding: 0 6px; max-height: 0; overflow: hidden; transition: max-height .4s, padding .4s; }
#aviso.visible { max-height: 60px; padding: 5px 6px; }
#ficha { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 6px 0 0; }
#ficha dt { color: #bdb8ad; text-transform: uppercase; font-size: 8px; letter-spacing: .1em; padding-top: 2px; }
#ficha dd { margin: 0; color: #fff; }
@media (max-width: 900px) { #mapa { width: 150px; padding: 6px; } #mapaLienzo { width: 112px; height: 112px; margin: 0 auto; } #ficha { font-size: 9.5px; gap: 1px 6px; } #ficha dt { font-size: 7px; } #sonido { font-size: 10.5px; padding: 8px 5px; } }
#velo { position: fixed; inset: 0; z-index: 1; opacity: 0; pointer-events: none; }
#destello { position: fixed; inset: 0; z-index: 1; background: var(--papel); opacity: 0; pointer-events: none; transition: opacity .6s ease-out; }
.chip { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 8px 10px; border: 1px solid var(--lacre); color: var(--papel); background: rgba(155, 61, 46, .35); border-radius: 2px; }
/* Las 10 instancias en una sola fila, a todo el ancho. */
.tira { order: 9; flex-basis: 100%; display: grid; grid-template-columns: auto repeat(10, minmax(0, 1fr)); gap: 6px; align-items: center; }
.tira button { padding: 7px 6px; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
@media (max-width: 1200px) { .tira { grid-template-columns: repeat(10, minmax(0, 1fr)); } .tira .rotulo { display: none; } }
.tira button b { font-weight: 500; color: var(--piedra); margin-right: 5px; }
.tira button[aria-pressed="true"] b { color: var(--papel); }
@media (max-width: 820px) {
  .tira { grid-template-columns: repeat(10, minmax(0, 1fr)); }
  .tira .rotulo, .tira .nombre { display: none; }
  .tira button { text-align: center; padding: 7px 0; }
  .tira button b { margin: 0; color: var(--papel); }
}
#nota {
  position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(460px, calc(100vw - 360px)); padding: 10px 14px 12px; background: var(--velo);
  border-left: 3px solid var(--lacre); font-size: 12px; line-height: 1.5; pointer-events: none;
}
#nota strong { display: block; font-family: var(--hyper); font-weight: 400; font-size: 18px; letter-spacing: .02em; color: var(--papel); margin-bottom: 2px; }
#nota span { color: #cfc9bb; }
#legibCaja { margin-top: 9px; display: grid; gap: 4px; }
#legibCaja b { font-weight: 400; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--piedra); }
#legibCaja div { height: 3px; background: rgba(233, 227, 214, .2); }
#legibCaja i { display: block; height: 100%; width: 0; background: var(--papel); }
@media (max-width: 1100px) { .ayuda { display: none; } }
body.leyendo .barra, body.leyendo #mapa, body.leyendo #palanca, body.leyendo #mirarPalanca, body.leyendo .vertical,
body.leyendo .ayuda { opacity: 0 !important; pointer-events: none !important; transition: opacity .3s; }
body.leyendo #nota { top: auto !important; bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important; padding: 6px 12px !important; }
body.leyendo #nota strong { display: inline; font-size: 14px; margin-right: 8px; }
body.leyendo #nota span { font-size: 12px; }
@media (max-width: 900px) { #nota { left: 16px; right: 16px; transform: none; width: auto; bottom: calc(168px + env(safe-area-inset-bottom, 0px)); } }
@media (max-width: 560px) { h1 { font-size: 17px; } }
</style>

<script>
// Si algo falla, que se vea en la pantalla de carga en vez de quedar colgado.
function mostrarError(texto) {

  if (window.__espacioAbierto) { console.warn("Hiperfuente:", texto); return; }

  if (t) t.textContent = "No se pudo abrir el espacio: " + texto;

  if (c) c.hidden = false;
}
addEventListener("error", (e) => {
  if (e.target && e.target.tagName === "SCRIPT") mostrarError("no cargó " + e.target.src);
  else if (e.message) mostrarError(e.message);
}, true);
addEventListener("unhandledrejection", (e) => mostrarError(String(e.reason && e.reason.message || e.reason)));

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

<script>
(async function () {
if (!window.THREE || !THREE.GLTFLoader || !THREE.OrbitControls) { mostrarError("no cargaron las librerías de Three.js."); return; }
const testGL = document.createElement("canvas");
if (!(testGL.getContext("webgl2") || testGL.getContext("webgl"))) { mostrarError("este navegador no tiene WebGL activado."); return; }
THREE.ColorManagement.legacyMode = false;

// ---------- Escena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const NIEBLA = new THREE.Color(0xd9d6cc);
scene.fog = new THREE.FogExp2(NIEBLA, 0.0007);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 4000);
camera.position.set(260, 150, 260);

// Blender es Z arriba; Three es Y arriba. Todo el modelo cuelga de esta raíz girada.
const raiz = new THREE.Group();
raiz.rotation.x = -Math.PI / 2;
scene.add(raiz);
const Q_RAIZ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
const blenderAThree = (v) => new THREE.Vector3(v[0], v[2], -v[1]);

// Cielo claro y nublado (luz de día pareja): un domo con degradé según la altura.
const cielo = new THREE.Mesh(
  new THREE.SphereGeometry(3000, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      cenit: { value: new THREE.Color(0x8fa3b3) }, medio: { value: new THREE.Color(0xc4ccd0) },
      horizonte: { value: new THREE.Color(0xe6e1d6) }, suelo: { value: new THREE.Color(0xb3ada1) },
    },
    vertexShader: "varying vec3 d; void main(){ d = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position.z = gl_Position.w; }",
    fragmentShader: `uniform vec3 cenit, medio, horizonte, suelo; varying vec3 d;
      void main(){ float h = d.y;
        vec3 c = h > 0.0 ? mix(mix(horizonte, medio, smoothstep(0.0, 0.18, h)), cenit, smoothstep(0.18, 0.8, h))
                         : mix(horizonte * 0.6, suelo, smoothstep(0.0, 0.12, -h));
        gl_FragColor = vec4(c, 1.0); }`,
  })
);
cielo.renderOrder = -1;
scene.add(cielo);

// Luz de día pareja: cielo claro de relleno y un sol alto (42°) que marca las caras sin oscurecer los textos.
scene.add(new THREE.HemisphereLight(0xf2f0ea, 0x6f6a60, 1.35));
const sol = new THREE.DirectionalLight(0xfff3e0, 1.05);
sol.position.set(0.55, 0.8, 0.35).multiplyScalar(300);
scene.add(sol);
const sol2 = new THREE.DirectionalLight(0xdfe6ff, 0.45);
sol2.position.set(-0.4, 0.3, 0.9).multiplyScalar(300);
scene.add(sol2);

// ---------- Texturas del grupo (herramientas/texturas_espacio.py) ----------
// Por familia: las imágenes (1 y 2 se reparten por pieza y gravedad) y cuántos metros cubre una repetición.
// Blender proyecta una repetición cada 2,4 m. Los textos quedan en color plano: tienen que leerse.
const cargadorT = new THREE.TextureLoader();
const TEX_FAMILIAS = {
  Tex_suelo: { imagenes: ["suelo"], metros: 6 },
  Tex_baldosas: { imagenes: ["baldosas1", "baldosas2"], metros: 4 },
  Tex_piedra: { imagenes: ["piedra"], metros: 3 },
  Tex_pared: { imagenes: ["pared1", "pared2"], metros: 3.5 },
  Tex_muro: { imagenes: ["muro1", "muro2"], metros: 3 },
};
const juegos = {}, vestidos = {};
function juegoDeTexturas(n, metros) {
  if (juegos[n]) return juegos[n];
  const t = {};
  for (const k of ["color", "normal", "ao"]) {
    const url = "texturas/" + n + "_" + k + ".jpg";
    // si la descarga se corta, se vuelve a pedir (hasta 3 veces); sin imagen, la superficie se ve negra
    const reintentar = (vez) => () => { if (vez < 3) setTimeout(() => cargadorT.load(url, (img) => { x.image = img.image; x.needsUpdate = true; }, undefined, reintentar(vez + 1)), 600 * vez); };
    const x = cargadorT.load(url, undefined, undefined, reintentar(1));
    x.wrapS = x.wrapT = THREE.RepeatWrapping;
    x.repeat.setScalar(2.4 / metros);
    x.anisotropy = 4;
    if (k === "color") x.encoding = THREE.sRGBEncoding;
    t[k] = x;
  }
  return (juegos[n] = t);
}
function elegir(lista, clave) {                       // reparte la versión 1 o 2 según la pieza
  let h = 0;
  for (const ch of clave) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return lista[h % lista.length];
}
const colorDeMat = (n) => { const c = datos.materiales[n] || [0.5, 0.5, 0.5]; return new THREE.Color().setRGB(c[0], c[1], c[2]); };
function vestir(nombre, clave) {
  const fam = TEX_FAMILIAS[nombre];
  const img = elegir(fam.imagenes, clave || nombre);
  if (vestidos[nombre + img]) return vestidos[nombre + img];
  const t = juegoDeTexturas(img, fam.metros);
  const base = new THREE.Color(1, 1, 1).lerp(colorDeMat(nombre), 0.15);
  if (nombre === "Tex_suelo") base.multiplyScalar(0.68);    // el suelo es muy claro: al sol directo se quemaba
  return (vestidos[nombre + img] = new THREE.MeshPhongMaterial({
    color: base, map: t.color, normalMap: t.normal, normalScale: new THREE.Vector2(1.2, 1.2), aoMap: t.ao,
    aoMapIntensity: 1.0, shininess: 3, specular: new THREE.Color(0x0b0b0b), side: THREE.DoubleSide,
  }));
}
function vestirCopia(nodo, clave) {
  nodo.traverse((o) => { if (o.isMesh && TEX_FAMILIAS[o.userData.mat]) o.material = vestir(o.userData.mat, clave + o.userData.mat + o.name); });
  return nodo;
}

// ---------- Materiales (color plano de la paleta) ----------
const materiales = {};
const lamparas = [];             // "lámparas esféricas de luz intermitente" (Babel): titilan
const LUZ_LAMPARA = new THREE.Color(1.0, 0.8, 0.55);
function material(nombre, rgba) {
  if (materiales[nombre]) return materiales[nombre];
  const color = new THREE.Color().setRGB(rgba[0], rgba[1], rgba[2]);
  let m;
  if (nombre.startsWith("Lampara") || nombre === "Color_ffd159") {
    m = new THREE.MeshPhongMaterial({ color: 0xf4f1ea, specular: 0xffffff, shininess: 140, transparent: true,
                                      opacity: 0.2, depthWrite: false, emissive: new THREE.Color(0, 0, 0) });
    m.userData.vidrio = true;
    lamparas.push(m);
  } else if (TEX_FAMILIAS[nombre]) {
    m = vestir(nombre, nombre);
  } else if (nombre === "Aleph") {
    m = new THREE.MeshBasicMaterial({ color: 0xfff1cc });
  } else if (nombre === "Horizonte") {
    // La frase del horizonte está a 1,8 km: la niebla normal la borraría. Se le da un velo fijo.
    m = new THREE.MeshBasicMaterial({ color: color.clone().lerp(NIEBLA, 0.22), fog: false });
  } else {
    m = new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide });
    if (rgba[3] < 0.99) { m.transparent = true; m.opacity = 0.35; m.depthWrite = false; }
  }
  return (materiales[nombre] = m);
}

// ---------- Carga ----------
const textoCarga = document.getElementById("textoCarga");
const relleno = document.querySelector("#barraCarga i");
const matriz = (f) => new THREE.Matrix4().set(...f);

textoCarga.textContent = "Cargando el espacio…";
// "no-cache": el navegador revalida siempre con el servidor, así la página no mezcla datos de versiones distintas.
const datos = await fetch("escena.json", { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error("escena.json respondió " + r.status); return r.json(); });
// El glTF trae la geometría embebida como data URI, y el Artifact no deja pedir data: con fetch.
// Así que se descarga el .json, se decodifica el buffer acá y se arma un GLB en memoria.
async function cargarModelo(url) {
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(url + " respondió " + r.status);
  const total = Number(r.headers.get("content-length")) || 12.9e6;
  const lector = r.body.getReader();
  const partes = [];
  let leido = 0;
  for (;;) {
    const { done, value } = await lector.read();
    if (done) break;
    partes.push(value);
    leido += value.length;
    relleno.style.width = Math.min(100, 100 * leido / total).toFixed(0) + "%";
    textoCarga.textContent = "Cargando el espacio… " + (leido / 1e6).toFixed(1) + " MB";
  }
  textoCarga.textContent = "Armando el espacio…";
  const crudo = new Uint8Array(leido);
  let p = 0;
  for (const parte of partes) { crudo.set(parte, p); p += parte.length; }
  const gl = JSON.parse(new TextDecoder().decode(crudo));
  if (gl.buffers.length !== 1) throw new Error("el modelo trae " + gl.buffers.length + " buffers");
  const b64 = atob(gl.buffers[0].uri.slice(gl.buffers[0].uri.indexOf(",") + 1));
  const bin = new Uint8Array(b64.length);
  for (let i = 0; i < b64.length; i++) bin[i] = b64.charCodeAt(i);
  delete gl.buffers[0].uri;
  gl.buffers[0].byteLength = bin.length;
  const json = new TextEncoder().encode(JSON.stringify(gl));
  const largoJson = Math.ceil(json.length / 4) * 4, largoBin = Math.ceil(bin.length / 4) * 4;
  const glb = new Uint8Array(12 + 8 + largoJson + 8 + largoBin);
  const dv = new DataView(glb.buffer);
  dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, glb.length, true);
  dv.setUint32(12, largoJson, true); dv.setUint32(16, 0x4E4F534A, true);
  glb.fill(0x20, 20, 20 + largoJson); glb.set(json, 20);
  const b = 20 + largoJson;
  dv.setUint32(b, largoBin, true); dv.setUint32(b + 4, 0x004E4942, true);
  glb.set(bin, b + 8);
  return new Promise((ok, mal) => new THREE.GLTFLoader().parse(glb.buffer, "", ok, mal));
}
const gltf = await cargarModelo("modelo.gltf.json");
const gltfEspejo = await cargarModelo("espejo.gltf.json");
// 2026-11-20: lo que dice cada personaje (x e y aparte, para que cada archivo pese menos de 16 MB) y las columnatas
for (const [archivo, destino] of [["columnatas.gltf.json", gltf]]) {
  const extra = await cargarModelo(archivo);
  for (const c of [...extra.scene.children]) destino.scene.add(c);
}
for (const g of [gltf, gltfEspejo]) g.scene.traverse((o) => {
  if (!o.isMesh) return;
  if (!o.geometry.attributes.normal) {
    const geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry;
    geo.computeVertexNormals();
    o.geometry = geo;
  }
  if (o.geometry.attributes.uv) o.geometry.setAttribute("uv2", o.geometry.attributes.uv);
});
// Las piezas espejo: solo se usa su geometría, en el mismo orden que la pieza original.
const espejoMallas = {};
for (const n of gltfEspejo.scene.children) {
  const l = [];
  n.traverse((o) => { if (o.isMesh) l.push(o); });
  espejoMallas[n.name.replace("_ESPEJO", "")] = l;
}

const pieza = {};
const nodosEntorno = [];
const nodosTitular = [];
const colNodos = {};
gltf.scene.traverse((o) => {
  if (o.isMesh) {
    o.userData.mat = o.material.name;
    o.material = material(o.material.name, datos.materiales[o.material.name] || [0.5, 0.5, 0.5, 1]);
  }
  if (/^(MODULO_Z|ESTRUCTURA|UNICO|PLACAS|COLUMNATAS|TEXTOS(_[ZXY])?|ESCALERAS_[ZXY]|ANAMORFOSIS_[ZXY])$/.test(o.name)) pieza[o.name] = o;
  else if (o.isMesh && o.name.startsWith("E_")) nodosEntorno.push(o);
  else if (o.isMesh && o.name.startsWith("T_")) nodosTitular.push(o);
  else if (["COL_MODULO", "COL_ESTRUCTURA", "COL_UNICO"].includes(o.name)) colNodos[o.name] = o;
});

// ---------- Escaleras: cartel de aeropuerto ----------
// Cada letra se da vuelta como una chapa del cartel (oscila hasta 180° alrededor del eje del renglón) mientras uno no está de frente; al pararse
// delante (dentro de un cono de ~60° y a menos de ~15 m), o muy cerca, se detiene y se lee. Lejos (más de ~100 m)
// quedan quietas, para el panorama. El centro de
// cada letra viene en COLOR_0 (ver 10_exportar_web.py); el signo de R dice hacia qué lado mira el renglón.
const uTiempo = { value: 0 };
const uCamara = { value: new THREE.Vector3() };   // MeshLambertMaterial no recibe cameraPosition: se pasa a mano
// R: x del centro (+0,5 si el renglón mira a +x o +y); G: y del centro (+0,5 si mira por el eje y); B: z.
function materialEscalera(hex) {
  const m = new THREE.MeshLambertMaterial({ color: new THREE.Color(hex), side: THREE.DoubleSide, vertexColors: true });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTiempo = uTiempo;
    sh.uniforms.uCam = uCamara;
    sh.uniforms.uCod = { value: new THREE.Vector2(datos.codigo.min, datos.codigo.rango) };
    sh.vertexShader = sh.vertexShader
      .replace("#include <common>", `#include <common>
        uniform float uTiempo; uniform vec2 uCod; uniform vec3 uCam;
        mat3 giroY(float a){ float c = cos(a), s = sin(a); return mat3(c, 0., -s, 0., 1., 0., s, 0., c); }
        mat3 giroX(float a){ float c = cos(a), s = sin(a); return mat3(1., 0., 0., 0., c, s, 0., -s, c); }`)
      .replace("#include <beginnormal_vertex>", `#include <beginnormal_vertex>
        float aeMira = color.r >= 0.5 ? 1.0 : -1.0;
        float aeEjeY = color.g >= 0.5 ? 1.0 : 0.0;
        vec3 aeCtr = vec3((color.r - (color.r >= 0.5 ? 0.5 : 0.0)) * 2.0, (color.g - aeEjeY * 0.5) * 2.0, color.b) * uCod.y + uCod.x;
        vec3 aeVista = transpose(mat3(modelMatrix)) * (uCam - modelMatrix[3].xyz);
        vec3 aeD = aeVista - aeCtr;
        float aeDist = length(aeD);
        vec2 aeH = normalize(aeD.xy + vec2(1e-4));
        float aeFrente = (aeEjeY > 0.5 ? aeH.y : aeH.x) * aeMira;
        float aeCerca = smoothstep(0.45, 0.75, aeFrente) * (1.0 - smoothstep(12.0, 22.0, aeDist));
        float aeMuyCerca = 1.0 - smoothstep(2.0, 4.0, aeDist);
        float aeLejos = smoothstep(80.0, 120.0, aeDist);
        float aeAzar = fract(sin(dot(aeCtr, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
        // Cada letra da una vuelta completa cada ~4 s (una ola que sube por la escalera) y vuelve a su lugar.
        // De frente y cerca, muy cerca o muy lejos, no se mueven.
        float aeQuieta = max(max(aeCerca, aeMuyCerca), aeLejos);
        float aeFase = fract(uTiempo * 0.25 - aeCtr.z * 0.11 + aeAzar * 0.35);
        float aeAng = aeQuieta > 0.5 ? 0.0 : 6.28318 * smoothstep(0.0, 0.22, aeFase);
        mat3 aeR = aeEjeY > 0.5 ? giroX(aeAng) : giroY(aeAng);
        objectNormal = aeR * objectNormal;`)
      .replace("#include <begin_vertex>", `#include <begin_vertex>
        transformed = aeCtr + aeR * (transformed - aeCtr);`);
    sh.fragmentShader = sh.fragmentShader.replace("#include <color_fragment>", "");
  };
  m.customProgramCacheKey = () => "escalera-v3";
  return m;
}
const matsEscalera = { Color_5cc6d2: materialEscalera(0x5cc6d2), Color_1e6973: materialEscalera(0x1e6973) };
for (const V of "ZXY") if (pieza["ESCALERAS_" + V]) pieza["ESCALERAS_" + V].traverse((o) => { if (o.isMesh) o.material = matsEscalera[o.userData.mat] || matsEscalera.Color_1e6973; });

// ---------- Anamorfosis: cada letra respira sobre su rayo desde el mirador y tiembla apenas ----------
// El centro de cada letra viene en COLOR_0. Desde el mirador la frase se sigue leyendo aunque se mueva.
const matAnamorfosis = new THREE.MeshBasicMaterial({ color: new THREE.Color(0x9b3d2e), vertexColors: true, side: THREE.DoubleSide });
matAnamorfosis.onBeforeCompile = (sh) => {
  sh.uniforms.uTiempo = uTiempo;
  sh.uniforms.uOjo = { value: new THREE.Vector3(...datos.mirador.ojo) };
  sh.uniforms.uCod = { value: new THREE.Vector2(datos.codigo.min, datos.codigo.rango) };
  sh.vertexShader = sh.vertexShader
    .replace("#include <common>", `#include <common>
      uniform float uTiempo; uniform vec3 uOjo; uniform vec2 uCod;`)
    .replace("#include <begin_vertex>", `#include <begin_vertex>
      vec3 anC = vec3(color.r * 2.0, color.g * 2.0, color.b) * uCod.y + uCod.x;
      float anF = fract(sin(dot(anC, vec3(12.9898, 78.233, 37.719))) * 43758.5453) * 6.2832;

// ---------- Núcleo: cartel de aeropuerto (letras que giran hasta que el lector se acerca) ----------

const ALFABETO = " ABCDEFGHIJKLMNÑOPQRSTUVWXYZÁÉÍÓÚÜ0123456789.,:;¿?¡!«»-";

function filasDelFolio(texto) {
  const filas = [];

    if (f && f.length + 1 + w.length > COLS) { filas.push(f); f = w; } else f = f ? f + " " + w : w;
  }
  if (f) filas.push(f);

const SALA_CLAVE = ["+++", ...Object.keys(datos.habitaciones).map((k) => k.replace("Habitacion_", ""))];

{
  const cd = datos.cartel;
  const L = new THREE.Matrix4().makeBasis(new THREE.Vector3(...cd.der), new THREE.Vector3(0, 0, 1), new THREE.Vector3(...cd.n))
    .setPosition(...cd.centro);

  salasM.forEach((S, r) => GIROS.forEach((G, g) => {
    const objetivo = filasDelFolio((datos.folios || [])[datos.ciclo.indexOf(SALA_CLAVE[r])] || "");
    const M = S.clone().multiply(G).multiply(L);
    if (S.determinant() < 0) M.multiply(new THREE.Matrix4().makeScale(-1, 1, 1));   // en los reflejos, se lee derecho
    const m = fijar(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: cartelQuieto.t })), M);
    raiz.add(m);
    const centro = blenderAThree(new THREE.Vector3(...cd.centro).applyMatrix4(S.clone().multiply(G)).toArray());
    carteles.push({ m, centro, objetivo, actual: objetivo.map((f) => f.map(() => ALFABETO[Math.floor(Math.random() * ALFABETO.length)])),

function dibujarCartel(c, lz) {

  g.font = "500 40px 'DM Mono', monospace"; g.textAlign = "center"; g.textBaseline = "middle";

function animarCarteles(dt) {
  for (const c of carteles) c.d = camera.position.distanceTo(c.centro);

  for (const c of carteles) if (c.vivo && !cerca.includes(c)) { lienzosVivos.push(c.vivo); c.vivo = null; c.m.material.map = cartelQuieto.t; }
  for (const c of cerca) if (!c.vivo && lienzosVivos.length) { c.vivo = lienzosVivos.pop(); c.m.material.map = c.vivo.t; }
  for (const c of cerca) {
    if (!c.vivo) continue;

// ---------- Entorno: letras y palabras sueltas, translúcidas y en movimiento ----------
// Anamorfosis: cada letra respira a lo largo de su rayo desde el punto de vista (se escala alrededor de ese
// punto), así sigue alineada y se lee desde ahí aunque se mueva. Palabras del relato: flotan despacio.
const colorDe = (n) => { const c = datos.materiales[n] || [0.5, 0.5, 0.5]; return new THREE.Color().setRGB(c[0], c[1], c[2]); };
const matsEntorno = {};
const matsPorEje = { x: [], y: [], z: [] };     // los textos de cada gravedad: se ven más cuando esa gravedad está activa
function materialEntorno(tipo, nombre, eje) {
  const k = tipo + nombre + (eje || "");
  if (matsEntorno[k]) return matsEntorno[k];
  const base = colorDe(nombre);
  const Clase = tipo === "pie" ? THREE.MeshLambertMaterial : THREE.MeshBasicMaterial;

    depthWrite: tipo === "pie", side: THREE.DoubleSide, fog: tipo !== "hor",

    m.userData.op = tipo === "ana" ? [0.22, 0.95] : [0.3, 1.0];

const entorno = [];
nodosEntorno.forEach((nodo, i) => {

  const tipo = n.startsWith("E_Anamorfosis_") ? "ana" : n.startsWith("E_Palabra_") ? "pal" : n.startsWith("E_Pie_") ? "pie" : "hor";
  const eje = tipo === "ana" || tipo === "pie" ? n.split("_")[2] : null;
  nodo.material = materialEntorno(tipo, nodo.userData.mat, eje);

const mA = new THREE.Matrix4(), mB = new THREE.Matrix4();
const mC = new THREE.Matrix4();
function animarEntorno(t) {
  for (const e of entorno) {
    if (e.tipo === "ana" && e.P) {
      // Las letras quedan quietas en su desorden: solo desde el punto se alinean. Pero nunca del todo
      // estáticas: van y vienen un poco sobre su rayo (eso no se ve desde el punto) y tiemblan apenas
      // alrededor de su centro (eso sí se ve, incluso cuando la frase se lee).
      const s = 1 + 0.08 * Math.sin(t * 0.45 + e.fase);

      mA.multiply(mB.makeTranslation(-e.P.x, -e.P.y, -e.P.z));

      e.nodo.matrix.multiplyMatrices(e.base, mB.makeScale(1, 1 + 0.03 * Math.sin(t * 0.8 + e.fase), 1));

// ---------- El icosaedro de cristal: encierra todo el objeto ----------
// Sus 12 vértices son las 12 esquinas de los rectángulos áureos y las puntas de las 12 columnas
// (cada columna va por la arista larga de un rectángulo, del pie, donde cruza otro plano, hasta el vértice).
// En cada vértice está la nota de su columna (sistema sonoro de los 24 espacios).
const CORTO = 69.6, LARGO = 112.6;            // medio lado corto y medio lado largo de los rectángulos

for (const a of [1, -1]) for (const b of [1, -1]) {

  VERTICES.push({ p: [b * LARGO, 0, a * CORTO], plano: 1, clave: [a, b] });   // y = 0: corto en z, largo en x
  VERTICES.push({ p: [a * CORTO, b * LARGO, 0], plano: 2, clave: [a, b] });   // z = 0: corto en x, largo en y

const NOTAS_POR_PLANO = [   // igual que BY_PLANE de audio/engine.js (clave = signos de los ejes corto y largo)
  { "++": 0, "+-": 3, "-+": 9, "--": 6 }, { "++": 4, "+-": 5, "-+": 10, "--": 11 }, { "++": 7, "+-": 1, "-+": 8, "--": 2 },
];

  // engine.js: x=0 por (y,z); y=0 por (z,x); z=0 por (x,y) → siempre (corto, largo)
  v.nota = NOTAS_POR_PLANO[v.plano][sg(s) + sg(l)];

for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) {
  const d = Math.hypot(...VERTICES[i].p.map((c, k) => c - VERTICES[j].p[k]));
  if (Math.abs(d - 2 * CORTO) < 1) ARISTAS.push([i, j]);

for (const [i, j] of ARISTAS) for (let k = j + 1; k < 12; k++) if (vecinos(i, k) && vecinos(j, k)) CARAS.push([i, j, k]);

const cristal = new THREE.Group();
cristal.name = "cristal";
{
  const pos = [];

  for (const [i, j] of ARISTAS) barra(VERTICES[i].p, VERTICES[j].p, 0.35, matArista);
  // Las 12 columnas: del pie (donde la arista larga cruza el otro plano) al vértice.
  const matColumna = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
  for (const v of VERTICES) {
    const pie = v.p.map((c) => (Math.abs(c) > LARGO - 1 ? 0 : c));

  }
  const esfera = new THREE.SphereGeometry(2.4, 20, 12);
  const matPunta = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x777777 });

  }

function animarTitular(t) {
  for (const e of titulares) {
    const c = (((t - e.retraso) % CICLO) + CICLO) % CICLO;
    const ancho = e.max - e.min;
    let desde = e.min - 1, hasta = e.max + 1;
    if (c < 7) hasta = e.min + ancho * Math.floor((c / 7) * 60) / 60;      // de a golpes, como una máquina
    else if (c < 17) { /* se lee */ }
    else if (c < 20) desde = e.min + ancho * ((c - 17) / 3);                // el bombardeo lo borra
    else hasta = e.min - 1;
    e.u.uDesde.value = desde;
    e.u.uHasta.value = hasta;
  }

  vArriba.set(0, 1, 0).applyQuaternion(camera.quaternion);
  const b = [Math.abs(vArriba.x), Math.abs(vArriba.z), Math.abs(vArriba.y)];      // en ejes de Blender
  let eje = "xyz"[b.indexOf(Math.max(...b))];

  for (const e of "xyz") {
    brillo[e] += ((e === eje ? 1 : 0) - brillo[e]) * Math.min(1, dt * 3);
    const piso = materiales["Fotocopia_Plano_" + e + "0"];

function rayoCol(o, d, max) {

  const x0 = Math.floor(Math.min(o.x, o.x + d.x * max) / C), x1 = Math.floor(Math.max(o.x, o.x + d.x * max) / C);
  const y0 = Math.floor(Math.min(o.y, o.y + d.y * max) / C), y1 = Math.floor(Math.max(o.y, o.y + d.y * max) / C);
  const z0 = Math.floor(Math.min(o.z, o.z + d.z * max) / C), z1 = Math.floor(Math.max(o.z, o.z + d.z * max) / C);

    if (!l) continue;
    for (const i of l) {
      if (selloCol[i] === generacionCol) continue;
      selloCol[i] = generacionCol;
      const k = i * 9;
      const ax = T[k], ay = T[k + 1], az = T[k + 2];
      const e1x = T[k + 3] - ax, e1y = T[k + 4] - ay, e1z = T[k + 5] - az;

      if (v < 0 || u + v > 1) continue;
      const tt = (e2x * qx + e2y * qy + e2z * qz) * inv;

}

class Juntador {

    for (const [src, dst, col] of [[gl.frente, this.f, this.cf], [gl.canto, this.c, this.cc]]) {
      if (!src) continue;
      const e = M.elements;
      for (let i = 0; i < src.length; i += 3) {
        const x = src[i], y = src[i + 1], z = src[i + 2];
        dst.push(e[0] * x + e[4] * y + e[8] * z + e[12], e[1] * x + e[5] * y + e[9] * z + e[13], e[2] * x + e[6] * y + e[10] * z + e[14]);
        if (color) col.push(...color);
      }
    }
  }
  malla(arr, colores, material) {
    if (!arr.length) return null;
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3));
    if (colores.length) g.setAttribute("color", new THREE.Float32BufferAttribute(colores, 4));
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, material);
    m.userData.mat = material.userData.nombre || "";

  }

// ---------- Composición de los muros (2026-11-24) ----------
// Antes: un solo cuerpo, justificado a lo bruto (renglones con huecos enormes) y el texto repetido hasta llenar.
// Ahora cada muro es una página compuesta: rótulo (azul tinta, espaciado), filete, capitular en lacre de tres
// renglones, cuerpo justificado con partición en sílabas (si un renglón queda flojo, se abre apenas el espaciado
// de las letras en vez de agrandar los blancos) y una firma al pie. El cuerpo toma el tamaño justo para que el texto
// entre una sola vez. Los muros M4 y M6 (las 24 citas) se componen como un índice: capítulo en lacre y cada cita con su voz.

const VOCAL = "AEIOUÁÉÍÓÚÜ", FUERTE = "AEOÁÉÍÓÚ", GRUPOS = ["BL", "BR", "CL", "CR", "DR", "FL", "FR", "GL", "GR", "KL", "KR", "PL", "PR", "TR", "TL", "CH", "LL", "RR"];
// Partición en sílabas del castellano (versión simple: diptongos, hiatos y grupos que no se separan).
function cortes(palabra) {
  const L = [...palabra], out = [];
  const vocal = (i) => VOCAL.includes(L[i]);
  const letra = (i) => /[A-ZÁÉÍÓÚÜÑ]/.test(L[i] || "");
  const nucleos = [];
  for (let i = 0; i < L.length; i++) {
    if (!vocal(i)) continue;
    const prev = nucleos[nucleos.length - 1];
    if (prev && prev[1] === i - 1) {
      if (FUERTE.includes(L[i]) && FUERTE.includes(L[i - 1])) { out.push(i); nucleos.push([i, i]); }   // hiato
      else prev[1] = i;                                                                                 // diptongo
    } else nucleos.push([i, i]);
  }
  const par = (i) => GRUPOS.includes(L[i] + L[i + 1]);
  for (let k = 1; k < nucleos.length; k++) {
    const a = nucleos[k - 1][1] + 1, b = nucleos[k][0], n = b - a;
    if (n <= 0) continue;
    if (n === 1) out.push(a);
    else if (n === 2) out.push(par(a) ? a : a + 1);
    else if (n === 3) out.push(par(a + 1) ? a + 1 : a + 2);
    else out.push(a + 2);
  }
  return out.filter((i) => i >= 2 && i <= L.length - 2 && letra(i - 1) && letra(i)).sort((x, y) => x - y);

// Diagramación: arma los renglones (con partición) y devuelve las letras ubicadas, o null si no entra.
// marcos: [{ancho, alto}]; piezas: [{texto, tam, color, tr, il, alin, antes, capitular, al_pie, renglones, partir}]
// o {filete: {antes, grosor}, color}. y crece hacia abajo desde el borde de arriba del marco.
function diagramar(marcos, piezas) {

      filetes.push({ m, y, grosor: P.filete.grosor, color: P.color });
      y += P.filete.grosor;

      if (yPie < y + (P.antes || 0)) return null;
      y = yPie;

    let cap = null;
    if (P.capitular && pal.length) {
      const ch = pal[0].t[0], tamC = (alto + 2 * lh) / ALTO_REF, gl = glifo(ch, 0);
      cap = { ch, tam: tamC, w: (gl.caja ? gl.caja.max.x : gl.adv) * tamC + tam * 0.4 };
      pal[0].t = pal[0].t.slice(1);
      if (!pal[0].t) pal.shift();
    }
    let nl = 0;
    while (pal.length) {
      if (y + alto > marcos[m].alto + 1e-6) {          // no entra: sigue en el marco siguiente
        if (P.al_pie || m + 1 >= marcos.length) return null;
        m++; y = 0;
      }
      const W = marcos[m].ancho, x0 = cap && nl < 3 ? cap.w : 0, Wl = W - x0;

      }

        const c = P.partir === false || pal[0].c !== P.color ? null : cortes(pal[0].t).reverse().find((i) => w + sep + ancho(pal[0].t.slice(0, i) + "-", tam, tr) <= Wl);
        if (c) { const pre = { t: pal[0].t.slice(0, c) + "-", c: pal[0].c }; fila.push(pre); pal[0].t = pal[0].t.slice(c); w += sep + ancho(pre.t, tam, tr); }
        else if (!fila.length) { fila.push(pal.shift()); w += pw; }

        for (const ch0 of p.t) { const ch = ch0 === "" ? " " : ch0; items.push({ m, x, y: y + alto, ch, tam, color: p.c, tr }); x += glifo(ch, 0).adv * tam * tr + track; }

}
// Las letras ubicadas, sobre el muro. marcos: [{o, der, arriba, n, ancho, alto, espesor}]
function emitir(marcos, d, espejo) {

    const der = V3(mk.der), o = V3(mk.o);
    if (espejo) { o.addScaledVector(der, mk.ancho); der.negate(); }
    return { der, o, arriba: V3(mk.arriba), n: V3(mk.n), esp: mk.espesor };
  });

    const b = base[it.m], gl = glifo(it.ch, b.esp / it.tam);
    if (!gl.frente) continue;

      .setPosition(b.o.clone().addScaledVector(b.der, mk.ancho / 2).addScaledVector(b.arriba, -f.y - f.grosor / 2)));

    if (malla) { malla.userData.mat = c; grupo.add(malla); }

// Anamorfosis: la cita en letras sueltas; cada una sobre su rayo desde el mirador, a una distancia al azar (6 a

function escribirAnamorfosis(lineas, W, espejo, semilla) {

  const F = (p) => (espejo ? p.clone().addScaledVector(der, -2 * p.clone().sub(ojo).dot(der)) : p);
  lineas.forEach((linea, nl) => {
    const vC = (lineas.length - 1) / 2 * 0.5 - nl * 0.5;
    const esc = ALTO / ALTO_REF;
    const letras = [...mayus(linea)].map((ch) => ({ ch, gl: glifo(ch, 0.1) }));
    const total = letras.reduce((a, l) => a + (l.gl.caja ? (l.gl.caja.max.x - l.gl.caja.min.x) : 0.6) * esc + INTER, 0) - INTER;
    let u = -total / 2;
    for (const { gl } of letras) {
      const w = gl.caja ? (gl.caja.max.x - gl.caja.min.x) * esc : 0.6 * esc;
      const uC = u + w / 2;

      const rayo = P.clone().sub(ojo).normalize();

        const dirW = aMundo(Q).sub(ojoW);
        const largo = dirW.length();
        if (!rayoCol(ojoW, dirW.normalize(), largo + 0.5)) { t = tt; break; }
      }
      if (!t) continue;
      const k = esc * t * rayo.dot(d) / D0;

      const up = arriba.clone().addScaledVector(normal, -arriba.dot(normal)).normalize();

// ---------- El cuerpo del lector ----------
// Pies, "arriba" (U: el eje de su gravedad, con signo), rumbo (H, perpendicular a U) y cabeceo.
// Colisión: rayos contra la malla de colisión (rayoCol). Hacia los costados, tres rayos (rodillas, pecho y
// cabeza) frenan y hacen deslizar contra las paredes; hacia abajo, un rayo desde la altura del escalón
// apoya los pies: así sube escalones de hasta 55 cm y baja sin despegarse. Sin piso, cae.
const OJOS = 1.6;
const CUERPO = { radio: 0.3, escalon: 0.55, g: 9.8, paso: 3.2, corre: 9, salto: 4.2 };
const cuerpo = { pies: new THREE.Vector3(), U: new THREE.Vector3(0, 1, 0), H: new THREE.Vector3(0, 0, -1), cab: 0,
                 vu: 0, suelo: false, caida: 0, lag: 0, suave: 0, ultimo: null };
const vMov = new THREE.Vector3(), vDir = new THREE.Vector3(), vDer = new THREE.Vector3(), vOri = new THREE.Vector3();
const vAbajo = new THREE.Vector3(), vMira = new THREE.Vector3(), vNorm = new THREE.Vector3(), CERO = new THREE.Vector3();
const mMira = new THREE.Matrix4(), qMira = new THREE.Quaternion();

function ejePrincipal(v) {
  const a = [Math.abs(v.x), Math.abs(v.y), Math.abs(v.z)], k = a.indexOf(Math.max(...a));
  const r = new THREE.Vector3();
  r.setComponent(k, Math.sign(v.getComponent(k)) || 1);
  return r;
}
function rumboDesde(U) {
  const f = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  cuerpo.cab = THREE.MathUtils.clamp(Math.asin(THREE.MathUtils.clamp(f.dot(U), -1, 1)), -1.4, 1.4);
  let h = f.clone().addScaledVector(U, -f.dot(U));
  if (h.lengthSq() < 1e-4) {                        // mirando justo arriba o abajo: el rumbo sale del "arriba" de la cámara
    h = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).multiplyScalar(-Math.sign(f.dot(U)) || 1);
    h.addScaledVector(U, -h.dot(U));
  }
  cuerpo.U.copy(U);
  cuerpo.H.copy(h.normalize());
}
// Pone el cuerpo donde está la cámara. Devuelve si hay algo para pisar debajo (hasta 120 m).
function entrarCaminar(U) {
  rumboDesde(U || ejePrincipal(new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion)));
  cuerpo.pies.copy(camera.position).addScaledVector(cuerpo.U, -OJOS);
  cuerpo.vu = 0; cuerpo.suelo = false; cuerpo.caida = 0; cuerpo.lag = 0; cuerpo.suave = 0;
  return !!rayoCol(camera.position, vAbajo.copy(cuerpo.U).negate(), 120);
}
function guardarCuerpo() {
  return { pies: cuerpo.pies.clone(), U: cuerpo.U.clone(), H: cuerpo.H.clone(), cab: cuerpo.cab,

}
function restaurarCuerpo(g) {
  cuerpo.pies.copy(g.pies); cuerpo.U.copy(g.U); cuerpo.H.copy(g.H); cuerpo.cab = g.cab;
  cuerpo.vu = 0; cuerpo.suelo = false; cuerpo.caida = 0; cuerpo.lag = 0;
}
function mirar(guinada, cabeceo) {
  cuerpo.H.applyAxisAngle(cuerpo.U, guinada);
  cuerpo.cab = THREE.MathUtils.clamp(cuerpo.cab + cabeceo, -1.45, 1.45);
}
function pisoBajo(desde, max) {
  const r = rayoCol(desde, vAbajo.copy(cuerpo.U).negate(), max);
  return r && r.n.dot(cuerpo.U) > 0.3 ? r : null;
}
function apoyar(desde, t) {
  const antes = cuerpo.pies.dot(cuerpo.U);
  const estaba = cuerpo.suelo;
  cuerpo.pies.copy(desde).addScaledVector(cuerpo.U, -t);
  if (estaba) cuerpo.lag -= cuerpo.pies.dot(cuerpo.U) - antes;    // el escalón se sube con la vista suave
  cuerpo.lag = THREE.MathUtils.clamp(cuerpo.lag, -0.6, 0.6);
  cuerpo.vu = 0; cuerpo.suelo = true; cuerpo.caida = 0;
  if (!cuerpo.ultimo) cuerpo.ultimo = { pies: new THREE.Vector3(), U: new THREE.Vector3(), H: new THREE.Vector3(), cab: 0 };
  cuerpo.ultimo.pies.copy(cuerpo.pies); cuerpo.ultimo.U.copy(cuerpo.U); cuerpo.ultimo.H.copy(cuerpo.H); cuerpo.ultimo.cab = cuerpo.cab;
}
const vAntes = new THREE.Vector3(), vPaso = new THREE.Vector3(), vEje = new THREE.Vector3(), vPrueba = new THREE.Vector3();
function hayPiso(p) {
  return !!pisoBajo(vPrueba.copy(p).addScaledVector(cuerpo.U, CUERPO.escalon), CUERPO.escalon + 0.6);
}
function pasoCuerpo(dt, f, s, corre, salta) {
  const U = cuerpo.U;
  vAntes.copy(cuerpo.pies);
  // Caminar: en el plano perpendicular a U, con deslizamiento contra las paredes.
  vDer.crossVectors(cuerpo.H, U);
  vMov.copy(cuerpo.H).multiplyScalar(f).addScaledVector(vDer, s);
  const largo = vMov.length();
  if (largo > 1) vMov.divideScalar(largo);
  vMov.multiplyScalar((corre ? CUERPO.corre : CUERPO.paso) * dt * (cuerpo.suelo ? 1 : 0.7));
  for (let it = 0; it < 3 && vMov.lengthSq() > 1e-10; it++) {
    const L = vMov.length();
    vDir.copy(vMov).divideScalar(L);
    let choque = null;
    for (const h of [0.6, 1.15, 1.7]) {
      vOri.copy(cuerpo.pies).addScaledVector(U, h);
      const r = rayoCol(vOri, vDir, L + CUERPO.radio);
      if (r && Math.abs(r.n.dot(U)) < 0.75 && (!choque || r.t < choque.t)) choque = r;
    }
    if (!choque) { cuerpo.pies.add(vMov); break; }
    const avance = Math.max(0, choque.t - CUERPO.radio);
    cuerpo.pies.addScaledVector(vDir, avance);
    vNorm.copy(choque.n).addScaledVector(U, -choque.n.dot(U)).normalize();
    if (choque.t < CUERPO.radio) cuerpo.pies.addScaledVector(vNorm, (CUERPO.radio - choque.t) * 0.5);
    vMov.copy(vDir).multiplyScalar(L - avance);
    vMov.addScaledVector(vNorm, -vMov.dot(vNorm));
  }
  // Bordes: caminando no se cae. Si el paso queda sin piso, se prueba deslizar por cada eje; si no, se queda.
  if (cuerpo.suelo && !salta && !hayPiso(cuerpo.pies)) {
    vPaso.copy(cuerpo.pies).sub(vAntes);
    cuerpo.pies.copy(vAntes);
    for (const eje of [[1, 0, 0], [0, 1, 0], [0, 0, 1]]) {
      vEje.set(...eje);
      if (Math.abs(vEje.dot(U)) > 0.5) continue;
      const c = vPaso.dot(vEje);
      if (Math.abs(c) < 1e-5) continue;
      cuerpo.pies.addScaledVector(vEje, c);
      if (!hayPiso(cuerpo.pies)) cuerpo.pies.addScaledVector(vEje, -c);
    }
  }
  // Vertical: apoyarse, subir o bajar escalones, saltar, caer.
  const arriba = vOri.copy(cuerpo.pies).addScaledVector(U, CUERPO.escalon);
  if (salta && cuerpo.suelo) { cuerpo.vu = CUERPO.salto; cuerpo.suelo = false; }
  if (cuerpo.suelo) {
    const r = pisoBajo(arriba, CUERPO.escalon + 0.6);
    if (r) { apoyar(arriba, r.t); return; }
    cuerpo.suelo = false;
  }
  cuerpo.vu = Math.max(cuerpo.vu - CUERPO.g * dt, -40);
  let dz = cuerpo.vu * dt;
  if (dz <= 0) {
    const r = pisoBajo(arriba, CUERPO.escalon - dz);
    if (r) { apoyar(arriba, r.t); return; }
  } else {
    const techo = rayoCol(vMira.copy(cuerpo.pies).addScaledVector(U, OJOS + 0.1), U, dz + 0.15);
    if (techo) { cuerpo.vu = 0; dz = 0; }

  cuerpo.pies.addScaledVector(U, dz);
  cuerpo.caida -= Math.min(0, dz);
  if (cuerpo.caida > 150) {                         // cayó al vacío: vuelve al último lugar donde pisó
    cuerpo.caida = 0;
    if (cuerpo.ultimo) { restaurarCuerpo(cuerpo.ultimo); cuerpo.suave = 0; destellar(); }
    else recorrer(true);
  }
}
function colocarCamara(dt) {

  vMira.copy(cuerpo.H).multiplyScalar(Math.cos(cuerpo.cab)).addScaledVector(cuerpo.U, Math.sin(cuerpo.cab));
  mMira.lookAt(CERO, vMira, cuerpo.U);

// Botón Recorrer: si hay piso debajo, el lector se apoya ahí; si está lejos (afuera del objeto), viaja a la

const ENTRADA = { pies: [17.955, 59.355], mira: [0, -1, 0] };   // frente a la H de E4 (entrelazado)

    capaVelo.style.opacity = 0;                    // se levanta el velo y el lector queda suelto
    if (v.lectura) { const c = caratulaDe(v.lectura); if (c.sigue) { notaTitulo.textContent = "Sigue · " + c.voz; notaTexto.textContent = c.sigue; nota.hidden = false; } }
    const r = v.regreso;
    if (!r) { ponerModo("orbitar"); return; }
    const dist = camera.position.distanceTo(r.p);
    vuelo = { t0: performance.now(), dur: Math.min(4500, 1600 + dist * 30), p0: camera.position.clone(),
              c: camera.position.clone().add(r.p).multiplyScalar(0.5), q0: camera.quaternion.clone(), f0: camera.fov,
              d: { p: r.p, q: r.q, f: r.f }, alTerminar: () => { restaurarCuerpo(r); ponerModo("caminar"); } };
  }, 380);
}

// Legibilidad de la anamorfosis: máxima parado en el punto y mirando hacia donde mira la frase.
const vF = new THREE.Vector3(), vT = new THREE.Vector3();
function legibilidad() {
  if (actual < 0 || !instancias[actual].anamorfosis) { desafino = 0; return; }
  const p = poses[actual];
  vF.set(0, 0, -1).applyQuaternion(camera.quaternion);
  vT.set(0, 0, -1).applyQuaternion(p.q);
  const ang = Math.acos(Math.min(1, Math.max(-1, vF.dot(vT))));
  const l = Math.max(0, 1 - camera.position.distanceTo(p.p) / 6) * Math.max(0, 1 - ang / 0.6);
  legibBarra.style.width = (l * 100).toFixed(0) + "%";
  desafino = 1 - l;
}

// Enderezar: deja la mirada y pone "arriba" en la vertical del mundo.
document.getElementById("enderezar").onclick = () => {
  const delante = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  camera.up.set(0, 1, 0);
  camera.lookAt(camera.position.clone().add(delante));
};

// Mirar arrastrando sobre la pantalla (al recorrer): se "agarra" el espacio.
let arrastre = null;
lienzo.addEventListener("pointerdown", (e) => {
  if (modo !== "caminar" || document.pointerLockElement === lienzo) return;
  arrastre = { id: e.pointerId, x: e.clientX, y: e.clientY };
  try { lienzo.setPointerCapture(e.pointerId); } catch (err) { /* puntero sintético o ya liberado */ }
});
lienzo.addEventListener("pointermove", (e) => {
  if (!arrastre || e.pointerId !== arrastre.id || vuelo || velo) return;
  const dx = e.clientX - arrastre.x, dy = e.clientY - arrastre.y;
  arrastre.x = e.clientX; arrastre.y = e.clientY;
  mirar(dx * 0.0035, dy * 0.0035);
});
const soltar = (e) => { if (arrastre && e.pointerId === arrastre.id) arrastre = null; };
lienzo.addEventListener("pointerup", soltar);
lienzo.addEventListener("pointercancel", soltar);

// En compu, como en los juegos: un clic captura el mouse y moverlo mira; Esc lo suelta. La mira del centro
// sirve para tocar las esferas.
let capturado = false;
document.addEventListener("pointerlockchange", () => {
  capturado = document.pointerLockElement === lienzo;
  mira.hidden = !capturado;
});
document.addEventListener("mousemove", (e) => {
  if (!capturado || modo !== "caminar" || vuelo || velo) return;
  mirar(-e.movementX * 0.0022, -e.movementY * 0.0022);
});
function capturarMouse() {
  try { const r = lienzo.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (err) { /* sin captura: se mira arrastrando */ }
}

// Palancas táctiles: la izquierda camina (o vuela, en Orbitar), la derecha mira.
function hacerPalanca(el) {
  const perilla = el.querySelector(".perilla"), v = { x: 0, y: 0 };
  let dedo = null;
  const mover = (e) => {
    const r = el.getBoundingClientRect();
    let x = (e.clientX - r.left - r.width / 2) / (r.width / 2);
    let y = (e.clientY - r.top - r.height / 2) / (r.height / 2);
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
    v.x = x; v.y = y;
    perilla.style.transform = `translate(${x * 44}px, ${y * 44}px)`;
  };
  el.addEventListener("pointerdown", (e) => { dedo = e.pointerId; try { el.setPointerCapture(e.pointerId); } catch (err) { /* nada */ } mover(e); });
  el.addEventListener("pointermove", (e) => { if (e.pointerId === dedo) mover(e); });
  const soltarla = (e) => { if (e.pointerId !== dedo) return; dedo = null; v.x = v.y = 0; perilla.style.transform = ""; };
  el.addEventListener("pointerup", soltarla);
  el.addEventListener("pointercancel", soltarla);
  return v;
}
const empuje = hacerPalanca(palanca);
const giro = hacerPalanca(mirarPalanca);

let altura = 0;
for (const [id, v] of [["subir", 1], ["bajar", -1]]) {
  const b = document.getElementById(id);
  b.addEventListener("pointerdown", () => (altura = v));
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, () => (altura = 0));
}

const teclas = new Set();
addEventListener("keydown", (e) => {
  teclas.add(e.code);
  if (e.code === "Space" || e.code.startsWith("Arrow")) e.preventDefault();
  const m = /^(?:Digit|Numpad)(\d)$/.exec(e.code);          // 1…9 y 0 → instancias 1…10
  if (m) { const n = (Number(m[1]) + 9) % 10; if (instancias[n]) irAInstancia(n); }
  if (e.code === "KeyX" || e.code === "KeyY" || e.code === "KeyZ") girarA(e.code.slice(3).toLowerCase());
});
addEventListener("keyup", (e) => teclas.delete(e.code));
addEventListener("blur", () => teclas.clear());
// Un botón tocado con el mouse no se queda con el foco (si no, Espacio lo volvería a apretar).
document.addEventListener("click", (e) => { const b = e.target.closest && e.target.closest("button"); if (b && e.detail) b.blur(); });

// ---------- Bucle ----------
const reloj = new THREE.Clock();
function cuadro() {
  const dt = Math.min(reloj.getDelta(), 0.1);
  uTiempo.value = reloj.elapsedTime;
  uCamara.value.copy(camera.position);
  animarTitular(reloj.elapsedTime);
  gravedadActiva(dt);
  actualizarMapa(dt);
  // Si la página se abrió en una pestaña oculta, el lienzo quedó en 0 × 0: se corrige apenas hay tamaño.
  if (innerWidth > 0 && (renderer.domElement.clientWidth !== innerWidth || renderer.domElement.width === 0)) ajustarTamano();
  const tt = reloj.elapsedTime, parpadeo = 0.55 + 0.25 * Math.sin(tt * 2.3) + 0.2 * Math.sin(tt * 7.1 + 1.3) * Math.sin(tt * 0.9);
  for (const m of lamparas) m.emissive.copy(LUZ_LAMPARA).multiplyScalar(0.16 * parpadeo);
  animarEntorno(reloj.elapsedTime);
  animarCarteles(dt);
  actualizarSombra();
  revisarEscritura();
  if (vuelo) {
    pasoVuelo(performance.now());
  } else if (velo) {
    if (velo.esc) pasoLecturaEscalera();          // en las escaleras, se lee palabra por palabra y se sube
  } else {
    let f = -empuje.y, s = empuje.x, u = altura;
    if (teclas.has("KeyW") || teclas.has("ArrowUp")) f += 1;
    if (teclas.has("KeyS") || teclas.has("ArrowDown")) f -= 1;
    if (teclas.has("KeyD") || teclas.has("ArrowRight")) s += 1;
    if (teclas.has("KeyA") || teclas.has("ArrowLeft")) s -= 1;
    const corre = rapido || teclas.has("ShiftLeft") || teclas.has("ShiftRight");
    if (modo === "caminar") {
      if (giro.x || giro.y) mirar(-giro.x * 2.4 * dt, -giro.y * 1.7 * dt);
      pasoCuerpo(dt, f, s, corre, teclas.has("Space"));
      colocarCamara(dt);
    } else {
      // Cámara libre: vuela en la dirección en que mira y lleva consigo el centro de giro.
      if (teclas.has("KeyE")) u += 1;
      if (teclas.has("KeyQ")) u -= 1;
      if (f || s || u) {
        vMov.set(s, u, -f).multiplyScalar((corre ? 70 : 16) * dt).applyQuaternion(camera.quaternion);
        camera.position.add(vMov);
        orbita.target.add(vMov);
      }
      orbita.update();
      atravesarPlanos();
    }
  }
  legibilidad();
  revisarPortales();
  latirHalos(reloj.elapsedTime);
  mostrarEtiquetas();
  if (velo && performance.now() > velo.fin) terminarVelo();
  cielo.position.copy(camera.position);
  renderer.render(scene, camera);
  dibujarFundidoVelo();
}
function bucle() { cuadro(); requestAnimationFrame(bucle); }
irAInstancia(0, true);
bucle();
// Para depurar desde la consola (paso = un cuadro sin esperar a requestAnimationFrame).
window.visor = { scene, camera, renderer, raiz, irAInstancia, instancias, datos, uTiempo, entorno, girarA, paso: cuadro, get audio() { return audio; }, disparadores, irALectura,
                 cuerpo, recorrer, teclas, rayoCol, deBlender, aBlender, orbita, get modo() { return modo; } };

function ajustarTamano() {
  if (!innerWidth || !innerHeight) return;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener("resize", ajustarTamano);
})().catch((err) => mostrarError(err && err.message || String(err)));

<!-- Onboarding en el navegador (2026-11-21). Lo inserta herramientas/armar_visor_v3.py antes de </body>.
     Muestra las siete escenas del onboarding (onboarding/compositions, hechas con HyperFrames) en vivo: cada una se
     carga, se escala a la pantalla y se anima con su propia línea de tiempo de GSAP. Aparece la primera vez que se
     abre el enlace (o con ?intro); después, con el botón «?» de la barra. Mientras tanto, el espacio carga detrás. -->
<style>
  #onb { position: fixed; inset: 0; z-index: 1000; background: #e9e3d6; overflow: hidden; }
  #onb[hidden] { display: none; }
  #onb-escenario { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 50% 50%; }
  #onb-escenario .clip { will-change: opacity; }
  #onb-barra { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center;
               gap: 18px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
  #onb button { font-family: "DM Mono", monospace; font-size: 15px; letter-spacing: .04em; border: 1.5px solid #1f1d1b;
                background: #e9e3d6; color: #1f1d1b; padding: 10px 18px; cursor: pointer; border-radius: 0; }
  #onb button:hover { background: #1f1d1b; color: #e9e3d6; }
  #onb #onb-seguir { background: #9b3d2e; border-color: #9b3d2e; color: #e9e3d6; min-width: 150px; }
  #onb #onb-seguir:hover { background: #7e2f23; }
  #onb #onb-atras[disabled] { opacity: .3; cursor: default; }
  #onb-puntos { display: flex; gap: 8px; }
  #onb-puntos i { width: 9px; height: 9px; border: 1.5px solid #1f1d1b; display: block; }
  #onb-puntos i.si { background: #1f1d1b; }
  #onb-saltar { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px; }
  #onb-cargando { position: absolute; left: 16px; top: calc(18px + env(safe-area-inset-top, 0px)); font-family: "DM Mono", monospace;
                  font-size: 13px; color: #6f6a60; }
  @media (max-width: 600px) { #onb button { font-size: 13px; padding: 9px 12px; } #onb #onb-seguir { min-width: 110px; } }
</style>
<div id="onb" hidden role="dialog" aria-label="Cómo se usa Hiperfuente">
  <div id="onb-escenario"></div>
  <span id="onb-cargando"></span>
  <button id="onb-saltar">Saltar la introducción</button>
  <div id="onb-barra">
    <button id="onb-atras" aria-label="Página anterior">← Atrás</button>
    <div id="onb-puntos" aria-hidden="true"></div>
    <button id="onb-seguir">Seguir →</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script>
(function () {
  const CLAVE = "hiperfuente-intro-vista";
  const ESCENAS = [
    { id: "hero", loop: true, boton: "Empezar →" },
    { id: "idea" }, { id: "objeto" }, { id: "cuento" }, { id: "interfaz" }, { id: "escrituras" },
    { id: "esferas", boton: "Entrar al espacio →" },
  ];
  const $ = (id) => document.getElementById(id);
  const capa = $("onb"), escenario = $("onb-escenario"), puntos = $("onb-puntos");
  ESCENAS.forEach(() => puntos.appendChild(document.createElement("i")));
  window.__timelines = window.__timelines || {};
  let actual = -1, tl = null, clips = [], pedido = 0;
  const cache = {};

  function ajustar() {
    const s = Math.min(innerWidth / 1920, (innerHeight - 70) / 1080);
    escenario.style.transform = "translate(-50%, calc(-50% - 28px)) scale(" + s.toFixed(4) + ")";
  }
  addEventListener("resize", ajustar);

  async function traer(id) {
    if (!cache[id]) {
      const r = await fetch("onboarding/compositions/" + id + ".html", { cache: "no-cache" });
      // las rutas de la escena son relativas a su proyecto: se llevan a la carpeta del onboarding
      cache[id] = (await r.text()).replace(/(["'(])assets\//g, "$1onboarding/assets/");
    }
    return cache[id];
  }
  // La visibilidad de cada clip ([inicio, inicio + duración)) la maneja el reproductor de HyperFrames; acá, este tic.
  function visibilidad() {
    if (!tl) return;
    const t = tl.time();
    for (const c of clips) c.el.style.visibility = t >= c.a && t < c.b ? "" : "hidden";
  }
  gsap.ticker.add(visibilidad);

  async function ir(i) {
    if (i < 0 || i >= ESCENAS.length) return;
    const mio = ++pedido;
    const e = ESCENAS[i];
    $("onb-cargando").textContent = "";
    const html = await traer(e.id);
    if (mio !== pedido) return;
    if (tl) tl.kill();
    const doc = new DOMParser().parseFromString(html, "text/html");
    const frag = doc.querySelector("template").content.cloneNode(true);
    const guiones = [...frag.querySelectorAll("script")];
    guiones.forEach((s) => s.remove());
    escenario.replaceChildren(frag);
    delete window.__timelines[e.id];
    for (const s of guiones) new Function(s.textContent)();
    tl = window.__timelines[e.id];
    clips = [...escenario.querySelectorAll(".clip")].map((el) => {
      const a = parseFloat(el.dataset.start) || 0;
      return { el, a, b: a + (parseFloat(el.dataset.duration) || 1e9) };
    });
    actual = i;
    [...puntos.children].forEach((p, k) => p.classList.toggle("si", k === i));
    $("onb-atras").disabled = i === 0;
    $("onb-seguir").textContent = e.boton || "Seguir →";
    if (tl) {
      tl.eventCallback("onComplete", e.loop ? () => tl.play(0) : null);
      tl.play(0);
    }
    visibilidad();
    // la siguiente escena se va bajando mientras se mira esta
    if (ESCENAS[i + 1]) traer(ESCENAS[i + 1].id);
  }
  function abrir() {
    capa.hidden = false;
    ajustar();
    ir(0);
  }
  function cerrar(entrar) {
    capa.hidden = true;
    pedido++;
    if (tl) tl.kill();
    tl = null;
    escenario.replaceChildren();
    try { localStorage.setItem(CLAVE, "1"); } catch (err) { /* sin almacenamiento: se vuelve a mostrar la próxima vez */ }
    if (entrar) {
      // al terminar: el lector empieza caminando al pie de la H (instancia «La H»), cuando el espacio esté listo
      const empezar = () => (window.visor && window.visor.irAInstancia ? window.visor.irAInstancia(1) : setTimeout(empezar, 400));
      empezar();
    }
  }
  $("onb-seguir").onclick = () => (actual === ESCENAS.length - 1 ? cerrar(true) : ir(actual + 1));
  $("onb-atras").onclick = () => ir(actual - 1);
  $("onb-saltar").onclick = () => cerrar(false);
  // mientras está abierto, el teclado es del onboarding (no mueve el espacio de atrás)
  addEventListener("keydown", (e) => {
    if (capa.hidden) return;
    e.stopImmediatePropagation();
    if (e.key === "ArrowRight" || e.key === "Enter" || e.key === " ") { e.preventDefault(); $("onb-seguir").click(); }
    else if (e.key === "ArrowLeft") ir(actual - 1);
    else if (e.key === "Escape") cerrar(false);
  }, true);
  const boton = $("ayudaIntro");
  if (boton) boton.onclick = abrir;
  let vista = false;
  try { vista = localStorage.getItem(CLAVE) === "1"; } catch (err) { /* sin almacenamiento */ }
  // desde el 2026-11-26 aparece cada vez que se abre o se recarga la página (salvo con ?sinintro)
  if (!/[?&]sinintro/.test(location.search)) abrir();
})();
</script>
