:root {
  --noche: #16191C;        /* fondo mientras carga */
  --papel: #E9E3D6;
  --piedra: #A8A398;
  --lacre: #9B3D2E;
  --tinta: #2F4858;
  --velo: rgba(22, 25, 28, .62);
  --hyper: "FabiBlock", "Arial Black", sans-serif;
  --mono: "DM Mono", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
/* Reglas base: dentro de Claude las pone la plataforma, en GitHub Pages no. */
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--noche); color: var(--papel); font-family: var(--mono); font-size: 13px; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
.barra {
  position: fixed; left: 0; right: 0; top: 0; z-index: 2;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--velo), transparent);
  pointer-events: none;
}
.barra > * { pointer-events: auto; }
h1 { margin: 0; font-family: var(--hyper); font-weight: 400; font-size: 22px; letter-spacing: .02em; color: var(--papel); }
.grupo { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rotulo { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--piedra); margin-right: 2px; }
button {
  font: inherit; font-size: 12px; color: var(--papel); background: var(--velo);
  border: 1px solid rgba(233, 227, 214, .28); border-radius: 2px; padding: 7px 10px; cursor: pointer; min-height: 34px;
}
button[aria-pressed="true"] { background: var(--lacre); border-color: var(--lacre); }
button:focus-visible { outline: 2px solid var(--papel); outline-offset: 2px; }
.ayuda {
  position: fixed; z-index: 2; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  max-width: 300px; font-size: 11px; line-height: 1.5; color: var(--piedra); text-align: right; pointer-events: none;
}
#palanca {
  position: fixed; z-index: 2; left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  width: 128px; height: 128px; border-radius: 50%; border: 1px solid rgba(233, 227, 214, .35); background: var(--velo);
}
#perilla { position: absolute; left: 44px; top: 44px; width: 40px; height: 40px; border-radius: 50%; background: var(--papel); opacity: .8; }
.vertical { position: fixed; z-index: 2; left: calc(168px + env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.vertical button { width: 46px; }
#carga { position: fixed; inset: 0; z-index: 3; display: grid; place-content: center; gap: 10px; text-align: center; background: var(--noche); }
#carga strong { font-family: var(--hyper); font-weight: 400; font-size: 34px; color: var(--lacre); }
#barraCarga { width: 220px; height: 2px; background: rgba(233, 227, 214, .2); }
#barraCarga i { display: block; height: 100%; width: 0; background: var(--papel); }
.grav { min-width: 34px; font-weight: 500; }
/* Mapa lateral: el icosaedro en miniatura, con el piso de la gravedad activa siempre abajo, y la ficha del lugar. */
#mapa {
  position: fixed; z-index: 2; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(112px + env(safe-area-inset-top, 0px));
  width: 190px; padding: 8px 10px 10px; background: rgba(22, 25, 28, .5); border-left: 1px solid rgba(233, 227, 214, .25);
  color: #fff; font-family: var(--mono); font-size: 9.5px; line-height: 1.4; pointer-events: none;
}
#mapaLienzo { display: block; position: static; inset: auto; width: 170px; height: 170px; }
#sonido { pointer-events: auto; display: block; width: 100%; margin-bottom: 6px; font-size: 12px; font-weight: 500; letter-spacing: .06em; padding: 9px 8px; text-align: left; }
#sonido[aria-pressed="true"] { background: var(--lacre); border-color: var(--lacre); }
#aviso { min-height: 0; font-size: 10.5px; line-height: 1.35; color: #fff; background: rgba(155, 61, 46, .85); padding: 0 6px; max-height: 0; overflow: hidden; transition: max-height .4s, padding .4s; }
#aviso.visible { max-height: 60px; padding: 5px 6px; }
#ficha { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 6px 0 0; }
#ficha dt { color: #bdb8ad; text-transform: uppercase; font-size: 8px; letter-spacing: .1em; padding-top: 2px; }
#ficha dd { margin: 0; color: #fff; }
@media (max-width: 900px) { #mapa { width: 112px; padding: 5px; } #mapaLienzo { width: 102px; height: 102px; } #ficha { display: none; } #sonido { font-size: 10.5px; padding: 8px 5px; } }
#velo { position: fixed; inset: 0; z-index: 1; opacity: 0; pointer-events: none; }
#destello { position: fixed; inset: 0; z-index: 1; background: var(--papel); opacity: 0; pointer-events: none; transition: opacity .6s ease-out; }
.chip { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 8px 10px; border: 1px solid var(--lacre); color: var(--papel); background: rgba(155, 61, 46, .35); border-radius: 2px; }
/* Las 10 instancias en una sola fila, a todo el ancho. */
.tira { order: 9; flex-basis: 100%; display: grid; grid-template-columns: auto repeat(10, minmax(0, 1fr)); gap: 6px; align-items: center; }
.tira button { padding: 7px 6px; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
@media (max-width: 1200px) { .tira { grid-template-columns: repeat(10, minmax(0, 1fr)); } .tira .rotulo { display: none; } }
.tira button b { font-weight: 500; color: var(--piedra); margin-right: 5px; }
.tira button[aria-pressed="true"] b { color: var(--papel); }
@media (max-width: 820px) {
  .tira { grid-template-columns: repeat(10, minmax(0, 1fr)); }
  .tira .rotulo, .tira .nombre { display: none; }
  .tira button { text-align: center; padding: 7px 0; }
  .tira button b { margin: 0; color: var(--papel); }
}
#nota {
  position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(460px, calc(100vw - 360px)); padding: 10px 14px 12px; background: var(--velo);
  border-left: 3px solid var(--lacre); font-size: 12px; line-height: 1.5; pointer-events: none;
}
#nota strong { display: block; font-family: var(--hyper); font-weight: 400; font-size: 18px; letter-spacing: .02em; color: var(--papel); margin-bottom: 2px; }
#nota span { color: #cfc9bb; }
#legibCaja { margin-top: 9px; display: grid; gap: 4px; }
#legibCaja b { font-weight: 400; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--piedra); }
#legibCaja div { height: 3px; background: rgba(233, 227, 214, .2); }
#legibCaja i { display: block; height: 100%; width: 0; background: var(--papel); }
@media (max-width: 1100px) { .ayuda { display: none; } }
@media (max-width: 900px) { #nota { left: 16px; right: 16px; transform: none; width: auto; bottom: calc(168px + env(safe-area-inset-bottom, 0px)); } }
@media (max-width: 560px) { h1 { font-size: 17px; } }
</style>

<script>
// Si algo falla, que se vea en la pantalla de carga en vez de quedar colgado.
function mostrarError(texto) {
  // Una vez abierto el espacio, un error suelto no tapa la pantalla: queda en la consola.
  if (window.__espacioAbierto) { console.warn("Hiperfuente:", texto); return; }
  const t = document.getElementById("textoCarga");
  if (t) t.textContent = "No se pudo abrir el espacio: " + texto;
  const c = document.getElementById("carga");
  if (c) c.hidden = false;
}
addEventListener("error", (e) => {
  if (e.target && e.target.tagName === "SCRIPT") mostrarError("no cargó " + e.target.src);
  else if (e.message) mostrarError(e.message);
}, true);
addEventListener("unhandledrejection", (e) => mostrarError(String(e.reason && e.reason.message || e.reason)));
document.getElementById("textoCarga").textContent = "Cargando librerías…";
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<!-- Sistema sonoro de los 24 espacios (audio/engine.js del proyecto): notas, tríadas, modos y timbres. -->
<script src="audio24.js"></script>
<script>
(async function () {
if (!window.THREE || !THREE.GLTFLoader || !THREE.OrbitControls) { mostrarError("no cargaron las librerías de Three.js."); return; }
const testGL = document.createElement("canvas");
if (!(testGL.getContext("webgl2") || testGL.getContext("webgl"))) { mostrarError("este navegador no tiene WebGL activado."); return; }
THREE.ColorManagement.legacyMode = false;

// ---------- Escena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const NIEBLA = new THREE.Color(0xd9d6cc);
scene.fog = new THREE.FogExp2(NIEBLA, 0.0007);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 4000);
camera.position.set(260, 150, 260);

// Blender es Z arriba; Three es Y arriba. Todo el modelo cuelga de esta raíz girada.
const raiz = new THREE.Group();
raiz.rotation.x = -Math.PI / 2;
scene.add(raiz);
const Q_RAIZ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2);
const blenderAThree = (v) => new THREE.Vector3(v[0], v[2], -v[1]);

// Cielo claro y nublado (luz de día pareja): un domo con degradé según la altura.
const cielo = new THREE.Mesh(
  new THREE.SphereGeometry(3000, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      cenit: { value: new THREE.Color(0x8fa3b3) }, medio: { value: new THREE.Color(0xc4ccd0) },
      horizonte: { value: new THREE.Color(0xe6e1d6) }, suelo: { value: new THREE.Color(0xb3ada1) },
    },
    vertexShader: "varying vec3 d; void main(){ d = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); gl_Position.z = gl_Position.w; }",
    fragmentShader: `uniform vec3 cenit, medio, horizonte, suelo; varying vec3 d;
      void main(){ float h = d.y;
        vec3 c = h > 0.0 ? mix(mix(horizonte, medio, smoothstep(0.0, 0.18, h)), cenit, smoothstep(0.18, 0.8, h))
                         : mix(horizonte * 0.6, suelo, smoothstep(0.0, 0.12, -h));
        gl_FragColor = vec4(c, 1.0); }`,
  })
);
cielo.renderOrder = -1;
scene.add(cielo);

// Luz de día pareja: cielo claro de relleno y un sol alto (42°) que marca las caras sin oscurecer los textos.
scene.add(new THREE.HemisphereLight(0xf2f0ea, 0x8a8478, 1.6));
const sol = new THREE.DirectionalLight(0xfff3e0, 1.8);
const el = THREE.MathUtils.degToRad(42), az = THREE.MathUtils.degToRad(30);
sol.position.copy(blenderAThree([Math.cos(el) * Math.cos(az), Math.cos(el) * Math.sin(az), Math.sin(el)])).multiplyScalar(500);
scene.add(sol);

// ---------- Materiales (color plano de la paleta) ----------
const materiales = {};
const lamparas = [];             // "lámparas esféricas de luz intermitente" (Babel): titilan
const LUZ_LAMPARA = new THREE.Color(1.0, 0.8, 0.55);
function material(nombre, rgba) {
  if (materiales[nombre]) return materiales[nombre];
  const color = new THREE.Color().setRGB(rgba[0], rgba[1], rgba[2]);
  let m;
  if (nombre.startsWith("Lampara") || nombre === "Color_ffd159") {
    m = new THREE.MeshBasicMaterial({ color: new THREE.Color(1.0, 0.8, 0.55).multiplyScalar(1.6), fog: true });
    lamparas.push(m);
  } else if (nombre === "Horizonte") {
    // La frase del horizonte está a 1,8 km: la niebla normal la borraría. Se le da un velo fijo.
    m = new THREE.MeshBasicMaterial({ color: color.clone().lerp(NIEBLA, 0.22), fog: false });
  } else {
    m = new THREE.MeshLambertMaterial({ color, side: THREE.DoubleSide });
    if (rgba[3] < 0.99) { m.transparent = true; m.opacity = 0.35; m.depthWrite = false; }
  }
  return (materiales[nombre] = m);
}

// ---------- Carga ----------
const textoCarga = document.getElementById("textoCarga");
const relleno = document.querySelector("#barraCarga i");
const matriz = (f) => new THREE.Matrix4().set(...f);

textoCarga.textContent = "Cargando el espacio…";
// "no-cache": el navegador revalida siempre con el servidor, así la página no mezcla datos de versiones distintas.
const datos = await fetch("escena.json", { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error("escena.json respondió " + r.status); return r.json(); });
// El glTF trae la geometría embebida como data URI, y el Artifact no deja pedir data: con fetch.
// Así que se descarga el .json, se decodifica el buffer acá y se arma un GLB en memoria.
async function cargarModelo(url) {
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error(url + " respondió " + r.status);
  const total = Number(r.headers.get("content-length")) || 12.9e6;
  const lector = r.body.getReader();
  const partes = [];
  let leido = 0;
  for (;;) {
    const { done, value } = await lector.read();
    if (done) break;
    partes.push(value);
    leido += value.length;
    relleno.style.width = Math.min(100, 100 * leido / total).toFixed(0) + "%";
    textoCarga.textContent = "Cargando el espacio… " + (leido / 1e6).toFixed(1) + " MB";
  }
  textoCarga.textContent = "Armando el espacio…";
  const crudo = new Uint8Array(leido);
  let p = 0;
  for (const parte of partes) { crudo.set(parte, p); p += parte.length; }
  const gl = JSON.parse(new TextDecoder().decode(crudo));
  if (gl.buffers.length !== 1) throw new Error("el modelo trae " + gl.buffers.length + " buffers");
  const b64 = atob(gl.buffers[0].uri.slice(gl.buffers[0].uri.indexOf(",") + 1));
  const bin = new Uint8Array(b64.length);
  for (let i = 0; i < b64.length; i++) bin[i] = b64.charCodeAt(i);
  delete gl.buffers[0].uri;
  gl.buffers[0].byteLength = bin.length;
  const json = new TextEncoder().encode(JSON.stringify(gl));
  const largoJson = Math.ceil(json.length / 4) * 4, largoBin = Math.ceil(bin.length / 4) * 4;
  const glb = new Uint8Array(12 + 8 + largoJson + 8 + largoBin);
  const dv = new DataView(glb.buffer);
  dv.setUint32(0, 0x46546C67, true); dv.setUint32(4, 2, true); dv.setUint32(8, glb.length, true);
  dv.setUint32(12, largoJson, true); dv.setUint32(16, 0x4E4F534A, true);
  glb.fill(0x20, 20, 20 + largoJson); glb.set(json, 20);
  const b = 20 + largoJson;
  dv.setUint32(b, largoBin, true); dv.setUint32(b + 4, 0x004E4942, true);
  glb.set(bin, b + 8);
  return new Promise((ok, mal) => new THREE.GLTFLoader().parse(glb.buffer, "", ok, mal));
}
const gltf = await cargarModelo("modelo.gltf.json");

const pieza = {};
const nodosEntorno = [];
const nodosTitular = [];
gltf.scene.traverse((o) => {
  if (o.isMesh) {
    o.userData.mat = o.material.name;
    o.material = material(o.material.name, datos.materiales[o.material.name] || [0.5, 0.5, 0.5, 1]);
  }
  if (["MODULO_Z", "ESTRUCTURA", "ESCALERAS", "UNICO"].includes(o.name)) pieza[o.name] = o;
  else if (o.isMesh && o.name.startsWith("E_")) nodosEntorno.push(o);
  else if (o.isMesh && o.name.startsWith("T_")) nodosTitular.push(o);
});

// ---------- Escaleras: cartel de aeropuerto ----------
// Cada letra se da vuelta como una chapa del cartel (oscila hasta 180° alrededor del eje del renglón) mientras uno no está de frente; al pararse
// delante (dentro de un cono de ~60° y a menos de ~15 m), o muy cerca, se detiene y se lee. Lejos (más de ~100 m)
// quedan quietas, para el panorama. El centro de
// cada letra viene en COLOR_0 (ver 10_exportar_web.py); el signo de R dice hacia qué lado mira el renglón.
const uTiempo = { value: 0 };
const uCamara = { value: new THREE.Vector3() };   // MeshLambertMaterial no recibe cameraPosition: se pasa a mano
const matEscaleras = new THREE.MeshLambertMaterial({
  color: new THREE.Color(0x1e6973),        // cian oscuro: más claro que el negro, para que se lean como caracteres
  side: THREE.DoubleSide, vertexColors: true,
});
matEscaleras.onBeforeCompile = (sh) => {
  sh.uniforms.uTiempo = uTiempo;
  sh.uniforms.uCam = uCamara;
  sh.uniforms.uCod = { value: new THREE.Vector2(datos.codigo.min, datos.codigo.rango) };
  sh.vertexShader = sh.vertexShader
    .replace("#include <common>", `#include <common>
      uniform float uTiempo; uniform vec2 uCod; uniform vec3 uCam;
      mat3 giroY(float a){ float c = cos(a), s = sin(a); return mat3(c, 0., -s, 0., 1., 0., s, 0., c); }`)
    .replace("#include <beginnormal_vertex>", `#include <beginnormal_vertex>
      float aeMira = color.r >= 0.5 ? 1.0 : -1.0;
      vec3 aeCtr = vec3((color.r - (color.r >= 0.5 ? 0.5 : 0.0)) * 2.0, color.g, color.b) * uCod.y + uCod.x;
      vec3 aeVista = transpose(mat3(modelMatrix)) * (uCam - modelMatrix[3].xyz);
      vec3 aeD = aeVista - aeCtr;
      float aeDist = length(aeD);
      float aeFrente = normalize(aeD.xy + vec2(1e-4)).x * aeMira;
      float aeCerca = smoothstep(0.45, 0.75, aeFrente) * (1.0 - smoothstep(12.0, 22.0, aeDist));
      float aeMuyCerca = 1.0 - smoothstep(2.0, 4.0, aeDist);
      float aeLejos = smoothstep(80.0, 120.0, aeDist);
      float aeAzar = fract(sin(dot(aeCtr.yz, vec2(12.9898, 78.233))) * 43758.5453);
      // Cada letra da una vuelta completa cada ~4 s (una ola que sube por la escalera) y vuelve a su lugar:
      // los peldaños siguen armados por las letras. De frente, muy cerca o muy lejos, no se mueven.
      float aeQuieta = max(max(aeCerca, aeMuyCerca), aeLejos);
      float aeFase = fract(uTiempo * 0.25 - aeCtr.z * 0.11 + aeAzar * 0.35);
      float aeAng = aeQuieta > 0.5 ? 0.0 : 6.28318 * smoothstep(0.0, 0.22, aeFase);
      mat3 aeR = giroY(aeAng);
      objectNormal = aeR * objectNormal;`)
    .replace("#include <begin_vertex>", `#include <begin_vertex>
      transformed = aeCtr + aeR * (transformed - aeCtr);`);
  sh.fragmentShader = sh.fragmentShader.replace("#include <color_fragment>", "");
};
pieza.ESCALERAS.material = matEscaleras;

function fijar(obj, m) { obj.matrixAutoUpdate = false; obj.matrix.copy(m); return obj; }

// Una estructura = módulo z + sus copias giradas (gravedades x e y) + el núcleo.
const estructura = new THREE.Group();
for (const f of [null, ...datos.modulo]) {
  const m = f ? matriz(f) : new THREE.Matrix4();
  estructura.add(fijar(pieza.MODULO_Z.clone(), m));
  estructura.add(fijar(pieza.ESCALERAS.clone(), m));
}
if (pieza.ESTRUCTURA) estructura.add(fijar(pieza.ESTRUCTURA.clone(), new THREE.Matrix4()));
raiz.add(estructura);
// Las otras 7 habitaciones: la misma estructura reflejada en los planos.
const salasObj = [estructura];          // las 8 estructuras-habitación, en el mismo orden que datos.habitaciones
for (const f of Object.values(datos.habitaciones)) { const c = fijar(estructura.clone(), matriz(f)); salasObj.push(c); raiz.add(c); }
raiz.add(fijar(pieza.UNICO, new THREE.Matrix4()));

// ---------- Entorno: letras y palabras sueltas, translúcidas y en movimiento ----------
// Anamorfosis: cada letra respira a lo largo de su rayo desde el punto de vista (se escala alrededor de ese
// punto), así sigue alineada y se lee desde ahí aunque se mueva. Palabras del relato: flotan despacio.
const colorDe = (n) => { const c = datos.materiales[n] || [0.5, 0.5, 0.5]; return new THREE.Color().setRGB(c[0], c[1], c[2]); };
const matsEntorno = {};
const matsPorEje = { x: [], y: [], z: [] };     // los textos de cada gravedad: se ven más cuando esa gravedad está activa
function materialEntorno(tipo, nombre, eje) {
  const k = tipo + nombre + (eje || "");
  if (matsEntorno[k]) return matsEntorno[k];
  const base = colorDe(nombre);
  const Clase = tipo === "pie" ? THREE.MeshLambertMaterial : THREE.MeshBasicMaterial;
  const m = new Clase({
    color: tipo === "hor" ? base.lerp(NIEBLA, 0.04) : base,
    transparent: true, opacity: { ana: 0.82, pal: 0.55, hor: 0.95, pie: 1 }[tipo],
    depthWrite: tipo === "pie", side: THREE.DoubleSide, fog: tipo !== "hor",
  });
  if (eje) {
    m.userData.op = tipo === "ana" ? [0.22, 0.95] : [0.3, 1.0];
    matsPorEje[eje].push(m);
  }
  return (matsEntorno[k] = m);
}
const entorno = [];
nodosEntorno.forEach((nodo, i) => {
  const n = nodo.name;
  const tipo = n.startsWith("E_Anamorfosis_") ? "ana" : n.startsWith("E_Palabra_") ? "pal" : n.startsWith("E_Pie_") ? "pie" : "hor";
  const eje = tipo === "ana" || tipo === "pie" ? n.split("_")[2] : null;
  nodo.material = materialEntorno(tipo, nodo.userData.mat, eje);
  nodo.geometry.computeBoundingBox();
  nodo.userData.centro = nodo.geometry.boundingBox.getCenter(new THREE.Vector3());
  nodo.updateMatrix();
  nodo.matrixAutoUpdate = false;
  nodo.renderOrder = 10;
  entorno.push({ nodo, tipo, eje, base: nodo.matrix.clone(), fase: (i * 2.399) % 6.283,
                 P: eje && datos.puntos[eje] ? new THREE.Vector3(...datos.puntos[eje]) : null });
  raiz.add(nodo);
});
const mA = new THREE.Matrix4(), mB = new THREE.Matrix4();
const mC = new THREE.Matrix4();
function animarEntorno(t) {
  for (const e of entorno) {
    if (e.tipo === "ana" && e.P) {
      // Las letras quedan quietas en su desorden: solo desde el punto se alinean. Pero nunca del todo
      // estáticas: van y vienen un poco sobre su rayo (eso no se ve desde el punto) y tiemblan apenas
      // alrededor de su centro (eso sí se ve, incluso cuando la frase se lee).
      const s = 1 + 0.08 * Math.sin(t * 0.45 + e.fase);
      const c = e.nodo.userData.centro;
      mA.makeTranslation(e.P.x, e.P.y, e.P.z);
      mA.multiply(mB.makeScale(s, s, s));
      mA.multiply(mB.makeTranslation(-e.P.x, -e.P.y, -e.P.z));
      mA.multiply(e.base);
      mA.multiply(mB.makeTranslation(c.x, c.y + 0.025 * Math.sin(t * 1.3 + e.fase * 2), c.z));
      mA.multiply(mB.makeRotationZ(0.045 * Math.sin(t * 0.9 + e.fase * 3)));
      mA.multiply(mC.makeTranslation(-c.x, -c.y, -c.z));
      e.nodo.matrix.copy(mA);
    } else if (e.tipo === "pie") {
      // Las palabras de pie respiran apenas (se estiran hacia arriba y vuelven), siempre apoyadas en el piso.
      e.nodo.matrix.multiplyMatrices(e.base, mB.makeScale(1, 1 + 0.03 * Math.sin(t * 0.8 + e.fase), 1));
    } else if (e.tipo === "pal") {
      // Las cuatro partes del relato flotan y giran despacio sobre su eje, siempre.
      mA.makeTranslation(6 * Math.sin(t * 0.17 + e.fase * 2), 6 * Math.cos(t * 0.13 + e.fase), 10 * Math.sin(t * 0.25 + e.fase));
      e.nodo.matrix.multiplyMatrices(mA, e.base);
      e.nodo.matrix.multiply(mB.makeRotationY(0.9 * Math.sin(t * 0.2 + e.fase)));
    } else {
      mA.makeTranslation(0, 0, 6 * Math.sin(t * 0.1 + e.fase));
      e.nodo.matrix.multiplyMatrices(mA, e.base);
    }
    e.nodo.matrixWorldNeedsUpdate = true;
  }
}
// ---------- El icosaedro de cristal: encierra todo el objeto ----------
// Sus 12 vértices son las 12 esquinas de los rectángulos áureos y las puntas de las 12 columnas
// (cada columna va por la arista larga de un rectángulo, del pie, donde cruza otro plano, hasta el vértice).
// En cada vértice está la nota de su columna (sistema sonoro de los 24 espacios).
const CORTO = 69.6, LARGO = 112.6;            // medio lado corto y medio lado largo de los rectángulos
const VERTICES = [];                           // [x, y, z] en Blender, plano y nota
for (const a of [1, -1]) for (const b of [1, -1]) {
  VERTICES.push({ p: [0, a * CORTO, b * LARGO], plano: 0, clave: [a, b] });   // x = 0: corto en y, largo en z
  VERTICES.push({ p: [b * LARGO, 0, a * CORTO], plano: 1, clave: [a, b] });   // y = 0: corto en z, largo en x
  VERTICES.push({ p: [a * CORTO, b * LARGO, 0], plano: 2, clave: [a, b] });   // z = 0: corto en x, largo en y
}
const NOTAS_POR_PLANO = [   // igual que BY_PLANE de audio/engine.js (clave = signos de los ejes corto y largo)
  { "++": 0, "+-": 3, "-+": 9, "--": 6 }, { "++": 4, "+-": 5, "-+": 10, "--": 11 }, { "++": 7, "+-": 1, "-+": 8, "--": 2 },
];
const sg = (n) => (n > 0 ? "+" : "-");
for (const v of VERTICES) {
  const [s, l] = v.clave;                        // signo en el eje corto, signo en el eje largo
  // engine.js: x=0 por (y,z); y=0 por (z,x); z=0 por (x,y) → siempre (corto, largo)
  v.nota = NOTAS_POR_PLANO[v.plano][sg(s) + sg(l)];
}
const ARISTAS = [];
for (let i = 0; i < 12; i++) for (let j = i + 1; j < 12; j++) {
  const d = Math.hypot(...VERTICES[i].p.map((c, k) => c - VERTICES[j].p[k]));
  if (Math.abs(d - 2 * CORTO) < 1) ARISTAS.push([i, j]);
}
const vecinos = (i, j) => ARISTAS.some(([a, b]) => (a === i && b === j) || (a === j && b === i));
const CARAS = [];
for (const [i, j] of ARISTAS) for (let k = j + 1; k < 12; k++) if (vecinos(i, k) && vecinos(j, k)) CARAS.push([i, j, k]);

const cristal = new THREE.Group();
cristal.name = "cristal";
{
  const pos = [];
  for (const c of CARAS) for (const i of c) pos.push(...VERTICES[i].p);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  const vidrio = new THREE.Mesh(g, new THREE.MeshPhongMaterial({
    color: 0xf4f6f6, specular: 0xffffff, shininess: 90, transparent: true, opacity: 0.09,
    side: THREE.DoubleSide, depthWrite: false, fog: false,
  }));
  vidrio.renderOrder = 20;
  cristal.add(vidrio);
  const barra = (a, b, radio, mat) => {
    const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(radio, radio, A.distanceTo(B), 6, 1, true), mat);
    m.position.copy(A).add(B).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize());
    cristal.add(m);
  };
  const matArista = new THREE.MeshLambertMaterial({ color: 0xe4e2dc, transparent: true, opacity: 0.55 });
  for (const [i, j] of ARISTAS) barra(VERTICES[i].p, VERTICES[j].p, 0.35, matArista);
  // Las 12 columnas: del pie (donde la arista larga cruza el otro plano) al vértice.
  const matColumna = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
  for (const v of VERTICES) {
    const pie = v.p.map((c) => (Math.abs(c) > LARGO - 1 ? 0 : c));
    barra(pie, v.p, 0.9, matColumna);
  }
  const esfera = new THREE.SphereGeometry(2.4, 20, 12);
  const matPunta = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x777777 });
  for (const v of VERTICES) {
    const s = new THREE.Mesh(esfera, matPunta);
    s.position.set(...v.p);
    cristal.add(s);
  }
}
raiz.add(cristal);

// Las notas, junto a cada vértice (texto en la subsidiaria de la web, en blanco).

// ---------- Titular: escritura ploteada, la más efímera. Se imprime, se lee y el bombardeo lo borra ----------
const titulares = nodosTitular.map((nodo, i) => {
  const m = new THREE.MeshLambertMaterial({ color: colorDe(nodo.userData.mat), side: THREE.DoubleSide });
  const u = { uDesde: { value: -1e4 }, uHasta: { value: 1e4 } };
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, u);
    sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying float vLX;")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvLX = position.x;");
    sh.fragmentShader = sh.fragmentShader.replace("#include <common>", "#include <common>\nvarying float vLX;\nuniform float uDesde, uHasta;")
      .replace("void main() {", "void main() {\nif (vLX < uDesde || vLX > uHasta) discard;");
  };
  m.customProgramCacheKey = () => "titular";
  nodo.material = m;
  nodo.geometry.computeBoundingBox();
  const bb = nodo.geometry.boundingBox;
  raiz.add(nodo);
  const orden = nodo.name.includes("bajada") ? 2 : nodo.name.endsWith("_2") ? 1 : 0;
  return { u, min: bb.min.x - 0.5, max: bb.max.x + 0.5, retraso: orden * 1.4 };
});
const CICLO = 24;       // s: 7 imprimiéndose, 10 para leer, 3 borrándose, 4 en blanco
function animarTitular(t) {
  for (const e of titulares) {
    const c = (((t - e.retraso) % CICLO) + CICLO) % CICLO;
    const ancho = e.max - e.min;
    let desde = e.min - 1, hasta = e.max + 1;
    if (c < 7) hasta = e.min + ancho * Math.floor((c / 7) * 60) / 60;      // de a golpes, como una máquina
    else if (c < 17) { /* se lee */ }
    else if (c < 20) desde = e.min + ancho * ((c - 17) / 3);                // el bombardeo lo borra
    else hasta = e.min - 1;
    e.u.uDesde.value = desde;
    e.u.uHasta.value = hasta;
  }
}

const brillo = { x: 0, y: 0, z: 1 };
let ejeActivo = "";
function gravedadActiva(dt) {
  vArriba.set(0, 1, 0).applyQuaternion(camera.quaternion);
  const b = [Math.abs(vArriba.x), Math.abs(vArriba.z), Math.abs(vArriba.y)];      // en ejes de Blender
  let eje = "xyz"[b.indexOf(Math.max(...b))];
  // Histéresis: mirar hacia abajo (para leer un piso) inclina el "arriba" de la cámara; la gravedad no
  // cambia mientras el eje actual siga teniendo un peso razonable.
  if (ejeActivo && eje !== ejeActivo && b["xyz".indexOf(ejeActivo)] > 0.42) eje = ejeActivo;
  if (eje !== ejeActivo) {
    ejeActivo = eje;
    for (const b of botonesGravedad) b.setAttribute("aria-pressed", b.dataset.eje === eje);
  }
  for (const e of "xyz") {
    brillo[e] += ((e === eje ? 1 : 0) - brillo[e]) * Math.min(1, dt * 3);
    const piso = materiales["Fotocopia_Plano_" + e + "0"];
    if (piso && piso.emissive) piso.emissive.setRGB(0.42, 0.27, 0.12).multiplyScalar(brillo[e]);
    for (const m of matsPorEje[e]) m.opacity = m.userData.op[0] + (m.userData.op[1] - m.userData.op[0]) * brillo[e];
  }
}

function pasoVuelo(ahora) {
  const u = Math.min(1, (ahora - vuelo.t0) / vuelo.dur);
  const e = u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  const a = 1 - e;
  camera.position.copy(vuelo.p0).multiplyScalar(a * a).addScaledVector(vuelo.c, 2 * a * e).addScaledVector(vuelo.d.p, e * e);
  camera.quaternion.slerpQuaternions(vuelo.q0, vuelo.d.q, e);
  camera.fov = vuelo.f0 + (vuelo.d.f - vuelo.f0) * e;
  camera.updateProjectionMatrix();
  if (u >= 1) {
    const i = vuelo.i, lectura = vuelo.lectura;
    vuelo = null;
    if (i === null) ponerModo("caminar"); else llegar(i);
    if (lectura) iniciarVelo(lectura);
  }
}

const MEDIO_PLANO = 1.755, OJOS = 1.6;
const aBlender = (v) => [v.x, -v.z, v.y];
const deBlender = (b) => new THREE.Vector3(b[0], b[2], -b[1]);

// ---------- Sonido: una sola pieza que modula según dónde estás (sistema de audio/engine.js) ----------
// Un consort de tres voces, una por plano y con su timbre (x órgano de flautas, y cuerda frotada, z voz):
//   · cada pared suena su nota (las tres paredes de la habitación son su tríada, en afinación justa) y
//     suena más fuerte cuanto más cerca está el lector de esa pared: al moverse, cambia la mezcla;
//   · el piso es la tónica: bajo una octava abajo y la melodía, en el timbre del piso;
//   · la melodía tiene 4 frases de 12 unidades (ascenso, arco, descenso y cláusula sobre la final), con el
//     ritmo del modo (tono = 2, semitono = 1) y la nota característica acentuada en cada frase.
// Modos de Glarean (Dodecachordon, 1547): 6 especies, auténtico o plagal. Del lado positivo del plano del piso
// el modo es auténtico (de la final a la octava); del lado negativo, plagal (una cuarta abajo de la final a la
// quinta arriba). Cruzar una H cambia de auténtico a plagal sobre el mismo piso.
// Hay un solo reloj: un cambio de espacio espera al comienzo de la frase siguiente y entra deslizando las
// notas (modula dentro de la misma pieza, sin cortar el pulso). En las anamorfosis, el acorde se desafina
// cuando la frase se desarma: leer es afinar.
let espacioActual = null, plagalActual = false, desafino = 0;
const botonSonido = document.getElementById("sonido");
const CONTORNOS = [[0, 2, 4, "C", 4, 5, 4], [4, 5, 7, "C", 6, 5, 4], [7, 6, 4, "C", 3, 2, 1], [2, 4, 3, "C", 2, 1, 0]];
const nombreModo = (modo, plagal) => (plagal ? "Hipo" + modo.toLowerCase() : modo);
function melodia(sp, plagal, k) {
  const A = window.Audio24, md = A.MODES[sp.mode];
  const [lo, hi] = plagal ? [-4, 5] : [0, 8];
  let prev = k === 0 ? 0 : (plagal ? 1 : 4), inicio = 0;
  return CONTORNOS[k].map((d0, i) => {
    const d = d0 === "C" ? md.c : d0;
    let mejor = null;
    for (let o = -2; o <= 2; o++) {
      const pos = (d % 7) + 7 * o;
      if (pos < lo || pos > hi) continue;
      if (mejor === null || Math.abs(pos - prev) < Math.abs(mejor - prev)) mejor = pos;
    }
    if (mejor === null) mejor = d % 7;
    prev = mejor;
    const grado = ((mejor % 7) + 7) % 7, octava = Math.floor(mejor / 7);
    const nota = { inicio, dur: md.cells[i], f: sp.f0 * md.ratio[grado] * Math.pow(2, octava), acento: i === 3 };
    inicio += md.cells[i];
    return nota;
  });
}
// Razón justa de la nota de cada pared respecto de la tónica (la del piso es 1).
function razonesDeParedes(sp) {
