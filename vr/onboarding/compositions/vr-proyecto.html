        const g = document.createElementNS(NS, "g");

        const u = document.createElementNS(NS, "use");
        u.setAttribute("href", "#vr-proy-lomo" + b); u.setAttributeNS(XL, "xlink:href", "#vr-proy-lomo" + b);

        lista.push({ g, dx: 360 + ((b + s) % 3) * 120 - X0[b] });

      tl.to("#vr-proy-cortes", { opacity: 0, duration: 0.4, ease: "sine.in" }, 3.4);
      tl.fromTo("#vr-proy-marco", { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.9, ease: "power2.inOut" }, 5.6);
      tl.fromTo("#vr-proy-titulo .letra", { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.05, ease: "none" }, 5.9);
